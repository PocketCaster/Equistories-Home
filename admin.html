<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EquiStories — Admin</title>
<link rel="stylesheet" href="equi-shell.css" />
<link rel="stylesheet" href="equi-components.css" />
<script src="equi-nav.js" data-app="admin" defer></script>
</head>
<body>
<div id="equi-nav"></div>
<div id="nav" class="tabs"></div>

<div id="app">

<script type="module">
// ============================================
// FIRESTORE DATA LAYER — same shape as every other page (docs stored as
// { owner, id, json, updatedAt }). Copied verbatim from the Hub/Stable
// Manager pattern rather than inventing a new one, per the project's
// current "each page carries its own copy" stage (see README).
// ============================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAJfBnY0sDc6W_yzzrpm8NKkNZv1cu7jMU",
  authDomain: "equistories-rpg.firebaseapp.com",
  projectId: "equistories-rpg",
  storageBucket: "equistories-rpg.firebasestorage.app",
  messagingSenderId: "801283742596",
  appId: "1:801283742596:web:370951947bf862efcfdbd1"
};

let db=null, auth=null;
const ready = (async()=>{
  try{
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    auth = getAuth(app);
    await new Promise(res=>{ const un=onAuthStateChanged(auth, ()=>{ un(); res(); }); });
    if(!auth.currentUser){ try{ await signInAnonymously(auth); }catch(e){} }
    return true;
  }catch(e){ console.error('[Admin] Firebase init failed:', e); db=null; return false; }
})();

const EquiDB = {
  ready,
  get available(){ return !!db; },
  async get(col, id){
    if(!db) return null;
    const s = await getDoc(doc(db, col, String(id)));
    if(!s.exists()) return null;
    try { return JSON.parse(s.data().json); } catch(e){ return null; }
  },
  async put(col, id, owner, obj){
    if(!db) return false;
    await setDoc(doc(db, col, String(id)), {
      owner: String(owner), id: String(id),
      json: JSON.stringify(obj),
      updatedAt: new Date().toISOString(),
    });
    return true;
  },
};

// Owner identity comes from the bank session (same as equi-shell.css's
// session() helper). We ALSO need the Firestore custom-token upgrade so
// request.auth.uid actually equals the bank userId — otherwise every write
// here fails the isForumAdmin() rule even for a real admin, because the
// anonymous session's uid is a random string, not "PocketCaster".
function session(){
  try{
    const raw = localStorage.getItem("equi-lite-bank");
    if(!raw) return null;
    const b = JSON.parse(raw);
    return (b && b.linked && b.userId) ? b : null;
  }catch(e){ return null; }
}

// ============================================
// ADMIN GATE — hardcoded list, kept in sync with the Hub/Stable Manager
// copies until "shared core" exists (see README-SHELL.md).
// ============================================
const ADMIN_MEMBERS = ["PocketCaster"];
function isAdmin(who){ return !!who && ADMIN_MEMBERS.includes(who.userId); }

const STATS = ["stamina","strength","scope","speed","handiness","boldness","balance","gaits","harmony"];
const STAT_LABELS = { stamina:"Stamina", strength:"Strength", scope:"Scope", speed:"Speed",
  handiness:"Handiness", boldness:"Boldness", balance:"Balance", gaits:"Gaits", harmony:"Harmony" };

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const $ = id => document.getElementById(id);

const app = document.getElementById("app");

async function boot(){
  await ready;
  const who = session();

  if(!isAdmin(who)){
    app.innerHTML = `<div class="card"><h2>Admin</h2><p class="small">This page is for site admins only.</p></div>`;
    return;
  }

  app.innerHTML = `
    <div class="card">
      <h2>⚙ Admin Hub</h2>
      <p class="small">Every site-wide admin control, in one place. Per-shop and per-breed owner controls stay with their own shop/breed — this page is only for things that affect the whole site.</p>
    </div>

    <div class="card">
      <h3>Community content <span class="small muted">(shown to everyone on the Community tab)</span></h3>
      <label>Discord invite link</label><input id="a_discord" placeholder="https://discord.gg/…" />
      <label>How to get started</label><textarea id="a_start" rows="6" placeholder="Leave blank to use the default guide."></textarea>
      <label>How to affiliate a breed</label><textarea id="a_affil" rows="5" placeholder="Leave blank to use the default text."></textarea>
      <label>WidgetBot server ID</label><input id="a_wbs" placeholder="e.g. 299881420891881473" />
      <label>WidgetBot channel ID</label><input id="a_wbc" placeholder="e.g. 355719584830980096" />
      <div style="margin-top:12px;"><button id="a_save_community">Save community content</button>
        <span id="a_status_community" class="small" style="margin-left:8px;"></span></div>
    </div>

    <div class="card">
      <h3>Forum boards</h3>
      <p class="small muted">Don't change an existing board's id — its threads would detach.</p>
      <div id="a_boardRows"></div>
      <button id="a_addBoard" class="ghost" style="margin-top:6px;">+ Add board</button>
      <div style="margin-top:8px;"><button id="a_save_boards">Save boards</button> <span id="a_status_boards" class="small"></span></div>
    </div>

    <div class="card">
      <h3>Set Bonuses <span class="small muted">(applies site-wide when a full tack set is depicted together)</span></h3>
      <div id="a_setsList"></div>
      <div style="border-top:1px solid var(--equi-line, #333);margin-top:8px;padding-top:10px;">
        <label>New set name</label>
        <input id="a_set_name" placeholder="e.g. Winter Driving Set" style="max-width:320px;" />
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
          ${STATS.map(s=>`<div style="min-width:78px;"><label class="small">${STAT_LABELS[s]}</label><input type="number" id="a_set_stat_${s}" value="0" style="padding:4px 6px;width:100%;" /></div>`).join("")}
        </div>
        <div style="margin-top:8px;max-width:160px;"><label class="small">Set EXP</label><input type="number" id="a_set_exp" value="0" /></div>
        <button id="a_set_add" style="margin-top:10px;">+ Create Set</button>
      </div>
      <p class="small muted" style="margin-top:10px;">Shop owners assign items to a set from the dropdown when adding tack in their shop's Manage screen. Deleting a set here does not remove items — they just lose the set link.</p>
    </div>
  `;

  // ---- Community content: load + save (config/hub) ----
  const hubCfg = (await EquiDB.get('config','hub')) || {};
  $("a_discord").value = hubCfg.discord || "";
  $("a_start").value   = hubCfg.start   || "";
  $("a_affil").value   = hubCfg.affiliate || "";
  $("a_wbs").value     = hubCfg.wbServer  || "";
  $("a_wbc").value     = hubCfg.wbChannel || "";

  $("a_save_community").onclick = async ()=>{
    $("a_status_community").textContent = "Saving…";
    const next = { ...hubCfg,
      discord: $("a_discord").value.trim(),
      start: $("a_start").value,
      affiliate: $("a_affil").value,
      wbServer: $("a_wbs").value.trim(),
      wbChannel: $("a_wbc").value.trim(),
    };
    const ok = await EquiDB.put('config', 'hub', who.userId, next);
    $("a_status_community").textContent = ok ? "Saved." : "Failed to save.";
  };

  // ---- Forum boards: load + save (config/forum) ----
  const forumCfg = (await EquiDB.get('config','forum')) || {};
  const slugify = s => String(s||"").toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,24);
  let boardsState = Array.isArray(forumCfg.boards) ? forumCfg.boards.map(b=>({id:b.id||"",name:b.name||"",desc:b.desc||"",_existing:true})) : [];

  function drawBoardRows(){
    const box=$("a_boardRows");
    box.innerHTML = boardsState.map((b,i)=>`
      <div style="border:1px solid var(--equi-line,#333);border-radius:8px;padding:10px 12px;margin-bottom:8px;">
        <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;">
          <div><label class="small">Board name</label><input data-bd="${i}" data-f="name" value="${esc(b.name)}" placeholder="Advertisements" /></div>
          <div><label class="small">id ${b._existing?'<span style="color:var(--equi-bad,#c55)">(keep as-is)</span>':'<span class="muted">(auto)</span>'}</label><input data-bd="${i}" data-f="id" value="${esc(b.id)}" placeholder="ads" /></div>
        </div>
        <label class="small">Description</label><input data-bd="${i}" data-f="desc" value="${esc(b.desc)}" placeholder="What this board is for" />
        <button class="ghost danger" data-bddel="${i}" style="margin-top:6px;padding:4px 10px;">Remove</button>
      </div>`).join("") || `<p class="small muted">No boards yet.</p>`;
    box.querySelectorAll('[data-bd]').forEach(inp=>inp.oninput=()=>{
      const b=boardsState[+inp.dataset.bd], f=inp.dataset.f;
      b[f]=inp.value;
      if(f==="name" && !b._existing && !b._idTouched){ b.id=slugify(inp.value); const idInp=box.querySelector(`[data-bd="${inp.dataset.bd}"][data-f="id"]`); if(idInp) idInp.value=b.id; }
      if(f==="id"){ b._idTouched=true; b.id=slugify(inp.value); }
    });
    box.querySelectorAll('[data-bddel]').forEach(bt=>bt.onclick=()=>{ boardsState.splice(+bt.dataset.bddel,1); drawBoardRows(); });
  }
  drawBoardRows();
  $("a_addBoard").onclick = ()=>{ boardsState.push({id:"",name:"",desc:"",_existing:false}); drawBoardRows(); };
  $("a_save_boards").onclick = async ()=>{
    $("a_status_boards").textContent = "Saving…";
    const ok = await EquiDB.put('config', 'forum', who.userId, { boards: boardsState.map(({_existing,_idTouched,...b})=>b) });
    $("a_status_boards").textContent = ok ? "Saved." : "Failed to save.";
  };

  // ---- Set bonuses: load + save (config/global) ----
  const globalCfg = (await EquiDB.get('config','global')) || {};
  let tackSets = Array.isArray(globalCfg.tackSets) ? globalCfg.tackSets : [];

  function drawSets(){
    const box=$("a_setsList");
    box.innerHTML = tackSets.length ? tackSets.map(set=>{
      const b=set.bonus||{};
      const bstr=[...Object.entries(b.stats||{}).map(([s,v])=>`+${v} ${STAT_LABELS[s]||s}`), b.exp?`+${b.exp} EXP`:''].filter(Boolean).join(" · ");
      return `<div style="border:1px solid var(--equi-line,#333);border-radius:8px;padding:10px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">
          <b>◈ ${esc(set.name)}</b>
          <button class="ghost danger" data-delset="${esc(set.id)}" style="font-size:.9em;padding:3px 8px;">Delete set</button>
        </div>
        <div class="small" style="margin-top:4px;">Bonus when all worn together: <b>${bstr||'none set'}</b></div>
      </div>`;
    }).join("") : `<p class="small muted">No sets yet.</p>`;
    box.querySelectorAll('[data-delset]').forEach(btn=>btn.onclick=async ()=>{
      if(!confirm('Delete this set? Items keep their individual bonuses; they just lose the set link.')) return;
      tackSets = tackSets.filter(s=>s.id!==btn.dataset.delset);
      await EquiDB.put('config', 'global', who.userId, { ...globalCfg, tackSets });
      drawSets();
    });
  }
  drawSets();

  $("a_set_add").onclick = async ()=>{
    const name = $("a_set_name").value.trim();
    if(!name){ alert("Name the set first."); return; }
    const bstats={};
    STATS.forEach(s=>{ const v=Number($("a_set_stat_"+s).value)||0; if(v!==0) bstats[s]=v; });
    const bonus={ stats:bstats, exp:Number($("a_set_exp").value)||0 };
    tackSets.push({ id:'set_'+Math.random().toString(36).slice(2,9), name, bonus });
    const ok = await EquiDB.put('config', 'global', who.userId, { ...globalCfg, tackSets });
    if(ok){ $("a_set_name").value=""; STATS.forEach(s=>{ $("a_set_stat_"+s).value=0; }); $("a_set_exp").value=0; drawSets(); }
    else alert("Failed to save set.");
  };
}

boot();
</script>
</div>
</body>
</html>
