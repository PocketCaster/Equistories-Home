<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EquiStories — Admin</title>
<link rel="stylesheet" href="equi-shell.css" />
<link rel="stylesheet" href="equi-components.css" />
<link rel="stylesheet" href="equi-mobile.css?v=2" />
<style>
  /* Same responsive root size the Stable Manager and Shows use, so the three
     apps read at identical scale instead of the hub looking shrunken. */
  /* root font-size now comes from equi-shell.css, shared by all pages */

  /* Palette bridges the Hub's dark walnut with the Bank's brass/honey/parchment,
     so the three apps feel like one place. Variable NAMES are unchanged so every
     existing rule keeps working — only the values and the accents are richer. */
  :root{
    --bg:#1a130c; --panel:#241a12; --panel2:#2c2016; --line:#4a3826;
    --text:#f3e9d8; --dim:#c1ad92;
    --accent:#d29a3e; --accent2:#c9a8e8; --good:#8a9e68; --bad:#b5623a; --deep:#140e07;
    --honey:#c8842a; --rust:#9b4f2a; --moss:#5a6e3a;
    --brass-light:#e8c97a; --brass-mid:#c9a84c; --brass-dark:#8a6820;
    --gold-shine:linear-gradient(135deg,#e8c97a 0%,#c9a84c 30%,#f2d97e 50%,#c9a84c 70%,#8a6820 100%);
  }
  /* box-sizing reset lives in equi-shell.css */
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--equi-serif); line-height:1.6; }
  a{ color:var(--accent); }

  /* header styling lives in equi-shell.css (.equi-hd) — one definition only */
  /* .wrap geometry lives in equi-shell.css, shared by all pages */
  h1{ margin:0; font-family:var(--equi-display); font-weight:700; font-size:clamp(1.8rem,4vw,2.6rem);
      background:var(--gold-shine); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:.5px; }
  .tagline{ color:var(--dim); margin:2px 0 0; font-family:'Caveat',cursive; font-size:1.3rem; }
  nav{ display:flex; gap:4px; flex-wrap:wrap; margin-top:14px; }
  .tab{ padding:9px 18px; border:1px solid var(--line); border-bottom:none;
        border-radius:8px 8px 0 0; cursor:pointer; background:#1e1610; color:var(--dim);
        font-family:var(--equi-display); font-size:.98em; letter-spacing:.02em; }
  .tab.active{ background:var(--gold-shine); color:#241a14; font-weight:700; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; margin:16px 0;
         box-shadow:0 2px 14px rgba(0,0,0,.25), inset 0 0 0 1px rgba(201,168,76,.07); }
  .card h2{ margin:0 0 10px; font-family:var(--equi-display); color:var(--accent); font-size:1.5em; }
  .card h3{ margin:0 0 8px; font-family:var(--equi-display); color:var(--accent); font-size:1.22em; }
  .card h4{ font-family:var(--equi-display); }
  .grid{ display:grid; gap:12px; }
  .small{ font-size:.92em; color:var(--dim); }
  .tag{ display:inline-block; font-size:.9em; padding:3px 9px; border-radius:10px;
        background:var(--deep); color:var(--dim); border:1px solid var(--line); }
  button{ background:linear-gradient(135deg,var(--honey),var(--rust)); color:#fff6ea; border:none; padding:9px 18px; border-radius:6px;
          font-weight:700; cursor:pointer; font-family:var(--equi-display); font-size:1em;
          box-shadow:0 2px 0 rgba(80,32,10,.4), inset 0 1px 0 rgba(255,255,255,.12); }
  button:hover:not(:disabled){ filter:brightness(1.06); }
  button:disabled{ opacity:.6; cursor:not-allowed; }
  button.ghost{ background:#2c2118; color:var(--text); border:1px solid var(--line); box-shadow:none; font-family:var(--equi-serif); font-weight:500; }
  button.ghost:hover{ border-color:var(--brass-mid); filter:none; }
  input, textarea, select{ width:100%; padding:9px; font-size:1em; background:var(--deep); border:1px solid var(--line);
          color:var(--text); border-radius:5px; font-family:var(--equi-serif); }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--brass-mid); box-shadow:0 0 0 2px rgba(201,168,76,.22); }
  label{ font-size:.88em; color:var(--dim); text-transform:uppercase; display:block; margin-top:10px; letter-spacing:.03em; }
  .muted{ opacity:.7; }
  .hide{ display:none !important; }
  .linkbox{ display:block; background:var(--deep); border:1px solid var(--line); border-radius:8px;
            padding:14px; text-decoration:none; color:var(--text); transition:border-color .15s; }
  .linkbox:hover{ border-color:var(--accent); }
  .linkbox b{ color:var(--accent); display:block; font-size:1.1em; }

  /* ── SHOPS TAB ────────────────────────────────────────────── */
  .shop-tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .shop-tile{ border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--deep);
    cursor:pointer; transition:border-color .15s, transform .15s; display:flex; flex-direction:column; }
  .shop-tile:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .shop-tile .banner{ height:120px; background-size:cover; background-position:center;
    background-color:var(--panel2); border-bottom:1px solid var(--line); }
  .shop-tile .banner.noimg{ display:flex; align-items:center; justify-content:center; font-size:2.4em; color:var(--line); }
  .shop-tile .body{ padding:12px 14px; flex:1; display:flex; flex-direction:column; gap:5px; }
  .shop-tile .body b{ font-family:var(--equi-display); color:var(--accent); font-size:1.1em; }

  /* A storefront restyles itself with these locals, so each shop feels custom
     while still living inside the hub. Defaults inherit the hub's palette. */
  .storefront{ --sf-accent:var(--accent); --sf-bg:var(--panel); --sf-panel:var(--deep);
    --sf-text:var(--text); --sf-head:var(--brass-mid); }
  .sf-hero{ border-radius:12px; overflow:hidden; border:1px solid var(--line); margin-bottom:16px;
    background:var(--sf-panel); }
  .sf-hero .banner{ height:180px; background-size:cover; background-position:center; background-color:var(--sf-panel); }
  .sf-hero .banner.noimg{ display:flex; align-items:center; justify-content:center; font-size:3em; color:var(--sf-accent); opacity:.5; }
  .sf-hero .meta{ padding:16px 18px; }
  .sf-hero .meta h2{ margin:0; font-family:var(--equi-display); color:var(--sf-head); }
  .sf-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .sf-item{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--sf-panel);
    display:flex; flex-direction:column; }
  .sf-item .img{ height:150px; background-size:cover; background-position:center; background-color:var(--panel2); }
  .sf-item .img.noimg{ display:flex; align-items:center; justify-content:center; font-size:2em; color:var(--line); }
  .sf-item .pad{ padding:12px; flex:1; display:flex; flex-direction:column; gap:6px; }
  .sf-item .pad .nm{ font-family:var(--equi-display); color:var(--sf-head); font-weight:700; }
  .sf-price{ color:var(--sf-accent); font-family:var(--equi-display); font-weight:700; font-size:1.5rem; margin-top:auto; }
  .sf-buy{ background:var(--sf-accent); color:#1a130c; border:none; padding:7px 14px; border-radius:6px;
    font-family:var(--equi-display); font-weight:700; cursor:pointer; }
  .sf-buy:disabled{ opacity:.5; cursor:not-allowed; }
  .swatch-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .swatch{ display:flex; flex-direction:column; gap:4px; align-items:flex-start; }
  .swatch input[type=color]{ width:52px; height:36px; padding:2px; border:1px solid var(--line);
    border-radius:6px; background:var(--deep); cursor:pointer; }
  .shop-crumb{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }

  /* ── BREEDS TAB ───────────────────────────────────────────── */
  .breed-page{ --sf-accent:var(--accent); --sf-panel:var(--deep); --sf-head:var(--brass-mid); }
  .breed-sub{ display:flex; gap:6px; flex-wrap:wrap; margin:14px 0; }
  .breed-sub .bk-pill{ font-family:var(--equi-display); }
  .imp-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .imp-card{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--sf-panel); display:flex; flex-direction:column; }
  .imp-card .img{ height:170px; background-size:cover; background-position:center; background-color:var(--panel2); }
  .imp-card .img.noimg{ display:flex; align-items:center; justify-content:center; font-size:2.2em; color:var(--line); }
  .imp-card .pad{ padding:12px; flex:1; display:flex; flex-direction:column; gap:6px; }
  .imp-card .nm{ font-family:var(--equi-display); color:var(--sf-head); font-weight:700; }
  .imp-status{ font-size:.82em; padding:2px 8px; border-radius:10px; display:inline-block; width:max-content; }
  .imp-status.available{ background:#22301c; color:var(--good); border:1px solid var(--moss); }
  .imp-status.pending{ background:#332a14; color:var(--brass-light); border:1px solid var(--brass-dark); }
  .imp-status.sold{ background:#2a1a1a; color:var(--dim); border:1px solid var(--line); }
  .reg-row{ display:flex; align-items:center; gap:12px; padding:9px 12px; border:1px solid var(--line);
    border-radius:8px; margin-bottom:6px; background:var(--deep); }
  .reg-row .thumb{ width:40px; height:40px; border-radius:6px; background-size:cover; background-position:center; background-color:var(--panel2); flex:0 0 auto; }

  /* ── BANK TAB ─────────────────────────────────────────────── */
  .eyebrow{ font-family:var(--equi-serif); font-size:1.05rem; letter-spacing:.12em; text-transform:uppercase; color:var(--brass-mid); }
  .bank-hero{ border:1px solid var(--brass-mid);
    background:linear-gradient(180deg,#2a1f14,#20170f);
    box-shadow:0 4px 24px rgba(0,0,0,.35), inset 0 0 0 1px rgba(232,201,122,.15); }
  .bank-hero-row{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .bank-balance{ font-family:var(--equi-display); font-weight:700; font-size:clamp(2.6rem,7vw,3.4rem); line-height:1;
    background:var(--gold-shine); -webkit-background-clip:text; background-clip:text; color:transparent; margin:2px 0 4px; }
  .bank-hero-actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .bk-badge{ display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px;
    border-radius:9px; background:var(--rust); color:#fff; font-family:var(--equi-serif); font-weight:700; font-size:.85rem; }
  .bank-filters{ display:flex; gap:6px; }
  .bk-pill{ padding:4px 14px; border:1px solid var(--line); border-radius:20px; cursor:pointer; font-size:.85rem; color:var(--dim); user-select:none; }
  .bk-pill:hover{ border-color:var(--brass-mid); color:var(--text); }
  .bk-pill.active{ background:var(--gold-shine); color:#241a14; font-weight:700; border-color:var(--brass-dark); }
  .bk-tx{ display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    margin-bottom:8px; background:var(--deep); }
  .bk-tx.in{ border-left:3px solid var(--good); }
  .bk-tx.out{ border-left:3px solid var(--rust); }
  .bk-tx-ic{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--panel); flex:0 0 auto; font-size:1rem; }
  .bk-tx-body{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .bk-tx-body b{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bk-tx-date{ font-family:var(--equi-serif); color:var(--dim); opacity:.75; font-size:.95rem; }
  .bk-tx-amt{ font-family:var(--equi-serif); font-weight:700; font-size:1.35rem; white-space:nowrap; }
  .bk-tx-amt.in{ color:var(--good); }
  .bk-tx-amt.out{ color:var(--rust); }
  .bk-notif{ padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:var(--deep); }
  .bk-notif.unread{ border-color:var(--brass-mid); background:rgba(200,132,42,.09); }
  .bk-notif b{ color:var(--accent); text-transform:capitalize; }
  /* Even action cards: flex column so every button sits on the bottom edge,
     no matter how many fields the card has. */
  .bank-act{ display:flex; flex-direction:column; }
  .bank-act > button{ margin-top:auto; }
  /* Business section */
  .bk-subnav{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .bk-idbox{ background:var(--gold-shine); border:1px solid var(--brass-dark); border-radius:10px;
    padding:14px 16px; text-align:center; margin:12px 0; box-shadow:0 2px 0 var(--brass-dark); }
  .bk-idbox .lab{ font-family:var(--equi-serif); font-size:1rem; text-transform:uppercase; letter-spacing:.1em; color:#3e2b15; opacity:.85; }
  .bk-idbox .val{ font-family:var(--equi-mono); font-size:1.7rem; font-weight:700; color:#241a14; word-break:break-all; line-height:1.15; }
  .bk-idbox .hint{ font-size:.78rem; color:#3e2b15; font-style:italic; opacity:.85; margin-top:4px; }
</style>

<script src="equi-nav.js" data-app="admin" defer></script>
<script src="equi-constants.js?v=2"></script>
<script src="equi-bank.js"></script>
</head>
<body>
<div id="equi-nav"></div>
<div id="nav" class="tabs"></div>

<div id="app">

<script>
window.__equiDBReady = new Promise(r => { window.__equiDBResolve = r; });
</script>
<script type="module" src="equi-core.js"></script>

<script>
// Uses window.EquiDB (from equi-core.js) and the shared ADMIN_MEMBERS /
// isAdminMember / equiSession from equi-constants.js — nothing redefined
// locally here anymore.

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const $ = id => document.getElementById(id);

async function waitForDB(ms=8000){
  try{ await Promise.race([window.__equiDBReady||Promise.resolve(false),
                           new Promise(r=>setTimeout(()=>r(false),ms))]); }catch(e){}
  return (window.EquiDB && window.EquiDB.available) ? window.EquiDB : null;
}

const app = document.getElementById("app");

async function boot(){
  const EquiDB = await waitForDB();
  const who = equiSession();

  if(!EquiDB){
    app.innerHTML = `<div class="card"><h2>Admin</h2><p class="small">Database unavailable — try reloading.</p></div>`;
    return;
  }
  // Load the dynamic admin list (siteAdmins) BEFORE gating access. Without
  // this, __adminCache is empty here and ONLY the hardcoded founder passes —
  // which is why admins added via the Admin page could see the Admin tab but
  // got bounced the moment they opened this panel.
  try{ await loadAdminCache(EquiDB); }catch(e){}
  if(!isAdminMember(who && who.userId)){
    app.innerHTML = `<div class="card"><h2>Admin</h2><p class="small">This page is for site admins only.</p></div>`;
    return;
  }

  app.innerHTML = `
    <div class="card">
      <h2>⚙ Admin Hub</h2>
      <p class="small">Every site-wide admin control, in one place. Per-shop and per-breed owner controls stay with their own shop/breed — this page is only for things that affect the whole site.</p>
    </div>

    <div class="card">
      <h3>📢 Newsletter <span class="small muted">(sends a message to every member's inbox)</span></h3>
      <p class="small muted" style="margin-top:0;">Writes one inbox message to every registered member — announcements, event notices, updates. Members read and delete it like any other message.</p>
      <label class="small">Subject</label>
      <input id="a_nl_subject" placeholder="e.g. Spring Show Season is here!" maxlength="120" />
      <label class="small" style="margin-top:8px;">Message</label>
      <textarea id="a_nl_body" rows="6" placeholder="Write your newsletter here…" style="width:100%;"></textarea>
      <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <button id="a_nl_send">Send to all members</button>
        <span id="a_nl_status" class="small" style="min-height:1.2em;"></span>
      </div>
    </div>

    <div class="card">
      <h3>Site Admins <span class="small muted">(can open this Admin page and moderate the forum)</span></h3>
      <p class="small muted" style="margin-top:0;">Founder admins are set in code and can't be removed here — everyone else added below takes effect immediately, no redeploy needed.</p>
      <div id="a_adminList"></div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:flex-end;">
        <div style="flex:1;min-width:200px;"><label class="small" style="margin-top:0;">Bank User ID</label><input id="a_admin_add" placeholder="e.g. PocketCaster" /></div>
        <button id="a_admin_addbtn">+ Add admin</button>
      </div>
      <div id="a_admin_status" class="small" style="margin-top:6px;min-height:1.2em;"></div>
    </div>

    <div class="card">
      <h3>Site links</h3>
      <label>Discord invite link <span class="small muted">(shown on the Home page)</span></label>
      <input id="a_discord" placeholder="https://discord.gg/…" />
      <div style="margin-top:12px;"><button id="a_save_community">Save</button>
        <span id="a_status_community" class="small" style="margin-left:8px;"></span></div>
    </div>

    <div class="card">
      <h3>Rules &amp; Guides <span class="small muted">(shown on the Community tab)</span></h3>
      <p class="small muted">Each entry is a section on the Community page. Give it a title and the body text; the optional <b>category</b> groups entries under a shared heading — type the same category (e.g. <i>Rules</i>, <i>Guides</i>, <i>Getting Started</i>) on entries that belong together. Blank category falls under “General”. Body supports <b>**bold**</b>, <b>__underline__</b>, <b>## Heading</b> (own line), <b>- bullet</b> (own line) and <b>[link](url)</b>.</p>
      <div id="a_guideRows"></div>
      <button id="a_addGuide" class="ghost" style="margin-top:6px;">+ Add entry</button>
      <div style="margin-top:8px;"><button id="a_save_guides">Save guides</button> <span id="a_status_guides" class="small"></span></div>
    </div>

    <div class="card">
      <h3>Forum boards</h3>
      <p class="small muted">Don't change an existing board's id — its threads would detach.</p>
      <div id="a_boardRows"></div>
      <button id="a_addBoard" class="ghost" style="margin-top:6px;">+ Add board</button>
      <div style="margin-top:8px;"><button id="a_save_boards">Save boards</button> <span id="a_status_boards" class="small"></span></div>
    </div>

    <div class="card">
      <h3>Set Bonuses <span class="small muted">(applies site-wide when a full tack set is depicted together)</span></h3>
      <div id="a_setsList"></div>
      <div style="border-top:1px solid var(--equi-line, #333);margin-top:8px;padding-top:10px;">
        <label>New set name</label>
        <input id="a_set_name" placeholder="e.g. Winter Driving Set" style="max-width:320px;" />
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
          ${STATS.map(s=>`<div style="min-width:78px;"><label class="small">${STAT_LABELS[s]}</label><input type="number" id="a_set_stat_${s}" value="0" style="padding:4px 6px;width:100%;" /></div>`).join("")}
        </div>
        <div style="margin-top:8px;max-width:160px;"><label class="small">Set EXP</label><input type="number" id="a_set_exp" value="0" /></div>
        <button id="a_set_add" style="margin-top:10px;">+ Create Set</button>
      </div>
      <p class="small muted" style="margin-top:10px;">Shop owners assign items to a set from the dropdown when adding tack in their shop's Manage screen. Deleting a set here does not remove items — they just lose the set link.</p>
    </div>

    <div class="card">
      <h3>Breeds & Genetics <span class="small muted">(Custom Breeds, Genes, Rare Markings, Mutations, Breeding Traits)</span></h3>
      <p class="small muted" style="margin-top:0;">This toolset lives in the Stable Manager (it needs the breeding/genetics app loaded), but it's no longer a visible tab there — this is the only door to it now.</p>
      <a class="btn" href="stable.html?tab=admin">Open Breeds & Genetics Admin →</a>
    </div>

    <div class="card">
      <h3>Item Override <span class="small muted">(edit ANY item in ANY shop — a failsafe, use sparingly)</span></h3>
      <p class="small muted" style="margin-top:0;">Search by item name or shop owner. This bypasses normal shop ownership — the item stays owned by its original shop, you're just fixing its data directly.</p>
      <input id="a_item_search" placeholder="Search items…" style="max-width:360px;" />
      <div id="a_itemResults" style="margin-top:10px;max-height:280px;overflow:auto;"></div>
      <div id="a_itemEditor" style="margin-top:14px;"></div>
    </div>
  `;

  // ---- Site Admins: dynamic list, load + add/remove ----
  let dynamicAdmins = [];
  try{ dynamicAdmins = (await EquiDB.listAll('siteAdmins')).map(r=>r.__owner||r.__id).filter(Boolean); }catch(e){}

  function drawAdminList(){
    const box=$("a_adminList");
    const founders = ADMIN_MEMBERS.map(uid=>({uid, founder:true}));
    const dynamics = dynamicAdmins.filter(uid=>!ADMIN_MEMBERS.includes(uid)).map(uid=>({uid, founder:false}));
    const all = [...founders, ...dynamics];
    box.innerHTML = all.length ? all.map(a=>`
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--deep);">
        <span>${esc(a.uid)}${a.founder?' <span class="tag">founder</span>':''}</span>
        ${a.founder?'':`<button class="ghost danger" data-admindel="${esc(a.uid)}" style="padding:3px 10px;font-size:.9em;">Remove</button>`}
      </div>`).join("") : `<p class="small muted">No admins yet.</p>`;
    box.querySelectorAll('[data-admindel]').forEach(btn=>btn.onclick=async()=>{
      const uid = btn.dataset.admindel;
      if(!confirm(`Remove admin access from "${uid}"?`)) return;
      btn.disabled = true;
      try{
        await revokeAdmin(EquiDB, uid);
        dynamicAdmins = dynamicAdmins.filter(x=>x!==uid);
        drawAdminList();
      }catch(err){ alert('Failed to remove: '+((err&&err.message)||err)); btn.disabled=false; }
    });
  }
  drawAdminList();

  $("a_admin_addbtn").onclick = async ()=>{
    const uid = $("a_admin_add").value.trim();
    const statusEl = $("a_admin_status");
    if(!uid){ statusEl.textContent = "Enter a Bank User ID first."; return; }
    if(ADMIN_MEMBERS.includes(uid) || dynamicAdmins.includes(uid)){ statusEl.textContent = `"${uid}" is already an admin.`; return; }
    statusEl.textContent = "Checking that account exists…";
    let check;
    try{ check = await railwayCall('/accountExists/'+encodeURIComponent(uid), { method:'GET' }); }
    catch(e){ statusEl.textContent = "Couldn't reach the bank server to verify that account. Try again."; return; }
    if(!check || !check.success || !check.exists){
      statusEl.textContent = `No bank account found for "${uid}". Check the exact spelling — it's case-sensitive.`;
      return;
    }
    statusEl.textContent = "Granting admin access…";
    try{
      await grantAdmin(EquiDB, uid);
      dynamicAdmins.push(uid);
      $("a_admin_add").value = "";
      statusEl.textContent = `"${uid}" is now an admin.`;
      drawAdminList();
    }catch(err){ statusEl.textContent = "Failed: "+((err&&err.message)||err); }
  };

  // ---- Site links: load + save (config/hub) ----
  // We only edit the Discord link now; spread the existing doc so any legacy
  // community fields still stored (start/affiliate/widgetbot) are preserved.
  const hubCfg = (await EquiDB.get('config','hub')) || {};
  $("a_discord").value = hubCfg.discord || "";

  $("a_nl_send").onclick = async ()=>{
    const subject = ($("a_nl_subject").value||"").trim().slice(0,120);
    const body = ($("a_nl_body").value||"").trim().slice(0,4000);
    const st = $("a_nl_status");
    if(!body){ st.textContent = "Write a message first."; return; }
    let recipients = [];
    try{ recipients = (await EquiDB.listAll('profiles')).map(p=>p.__owner||p.__id).filter(Boolean); }
    catch(e){ st.textContent = "Couldn't load members: "+(e&&(e.message||e.code)||e); return; }
    recipients = Array.from(new Set(recipients)).filter(u=> u && u !== (who&&who.userId));
    if(!recipients.length){ st.textContent = "No members found."; return; }
    if(!confirm("Send this newsletter to "+recipients.length+" member"+(recipients.length===1?"":"s")+"? This can't be undone.")) return;
    $("a_nl_send").disabled = true;
    let sent=0, failed=0;
    const chunk = 12;
    for(let i=0;i<recipients.length;i+=chunk){
      const batch = recipients.slice(i,i+chunk);
      await Promise.all(batch.map(async to=>{
        const id = 'msg_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
        const rec = { id, from: who.userId, to:String(to), subject, body, sentAt:new Date().toISOString(), read:false, newsletter:true };
        try{ await EquiDB.putWithField('messages', id, who.userId, rec, 'to', String(to)); sent++; }
        catch(e){ failed++; }
      }));
      st.textContent = "Sending… "+sent+"/"+recipients.length+(failed?(" ("+failed+" failed)"):"");
    }
    $("a_nl_send").disabled = false;
    st.textContent = "Done — delivered to "+sent+" member"+(sent===1?"":"s")+(failed?(", "+failed+" failed — press Send again to retry those"):"")+".";
    if(!failed){ $("a_nl_subject").value=""; $("a_nl_body").value=""; }
  };

  $("a_save_community").onclick = async ()=>{
    $("a_status_community").textContent = "Saving…";
    const next = { ...hubCfg, discord: $("a_discord").value.trim() };
    const ok = await EquiDB.put('config', 'hub', who.userId, next);
    $("a_status_community").textContent = ok ? "Saved." : "Failed to save.";
  };

  // ---- Rules & Guides: load + save (config/guides) ----
  const guidesCfg = (await EquiDB.get('config','guides')) || {};
  let guidesState = Array.isArray(guidesCfg.guides)
    ? guidesCfg.guides.map(g=>({ id:g.id||('g_'+Math.random().toString(36).slice(2,9)),
        title:g.title||"", category:g.category||"", body:g.body||"" }))
    : [];

  function drawGuideRows(){
    const box=$("a_guideRows");
    box.innerHTML = guidesState.map((g,i)=>`
      <div style="border:1px solid var(--equi-line,#333);border-radius:8px;padding:10px 12px;margin-bottom:8px;">
        <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;">
          <div><label class="small">Title</label><input data-gd="${i}" data-f="title" value="${esc(g.title)}" placeholder="e.g. Site Rules" /></div>
          <div><label class="small">Category <span class="muted">(optional)</span></label><input data-gd="${i}" data-f="category" value="${esc(g.category)}" placeholder="Rules" /></div>
        </div>
        <label class="small">Body</label><textarea data-gd="${i}" data-f="body" rows="6" placeholder="Write the rule or guide here…">${esc(g.body)}</textarea>
        <div style="display:flex;gap:6px;margin-top:6px;align-items:center;">
          <button class="ghost" data-gup="${i}" title="Move up" style="padding:4px 10px;">↑</button>
          <button class="ghost" data-gdown="${i}" title="Move down" style="padding:4px 10px;">↓</button>
          <button class="ghost danger" data-gddel="${i}" style="padding:4px 10px;margin-left:auto;">Remove</button>
        </div>
      </div>`).join("") || `<p class="small muted">No entries yet. Click “Add entry” to create one.</p>`;
    box.querySelectorAll('[data-gd]').forEach(inp=>inp.oninput=()=>{ guidesState[+inp.dataset.gd][inp.dataset.f]=inp.value; });
    box.querySelectorAll('[data-gddel]').forEach(bt=>bt.onclick=()=>{ if(confirm('Remove this entry?')){ guidesState.splice(+bt.dataset.gddel,1); drawGuideRows(); } });
    box.querySelectorAll('[data-gup]').forEach(bt=>bt.onclick=()=>{ const i=+bt.dataset.gup; if(i>0){ [guidesState[i-1],guidesState[i]]=[guidesState[i],guidesState[i-1]]; drawGuideRows(); } });
    box.querySelectorAll('[data-gdown]').forEach(bt=>bt.onclick=()=>{ const i=+bt.dataset.gdown; if(i<guidesState.length-1){ [guidesState[i+1],guidesState[i]]=[guidesState[i],guidesState[i+1]]; drawGuideRows(); } });
  }
  drawGuideRows();
  $("a_addGuide").onclick = ()=>{ guidesState.push({ id:'g_'+Math.random().toString(36).slice(2,9), title:"", category:"", body:"" }); drawGuideRows(); };
  $("a_save_guides").onclick = async ()=>{
    $("a_status_guides").textContent = "Saving…";
    const clean = guidesState
      .map(g=>({ id:g.id, title:(g.title||"").trim(), category:(g.category||"").trim(), body:(g.body||"").trim() }))
      .filter(g=>g.title || g.body);
    const ok = await EquiDB.put('config', 'guides', who.userId, { guides: clean });
    $("a_status_guides").textContent = ok ? "Saved." : "Failed to save.";
  };

  // ---- Forum boards: load + save (config/forum) ----
  const forumCfg = (await EquiDB.get('config','forum')) || {};
  const slugify = s => String(s||"").toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,24);
  let boardsState = Array.isArray(forumCfg.boards) ? forumCfg.boards.map(b=>({id:b.id||"",name:b.name||"",desc:b.desc||"",_existing:true})) : [];

  function drawBoardRows(){
    const box=$("a_boardRows");
    box.innerHTML = boardsState.map((b,i)=>`
      <div style="border:1px solid var(--equi-line,#333);border-radius:8px;padding:10px 12px;margin-bottom:8px;">
        <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;">
          <div><label class="small">Board name</label><input data-bd="${i}" data-f="name" value="${esc(b.name)}" placeholder="Advertisements" /></div>
          <div><label class="small">id ${b._existing?'<span style="color:var(--equi-bad,#c55)">(keep as-is)</span>':'<span class="muted">(auto)</span>'}</label><input data-bd="${i}" data-f="id" value="${esc(b.id)}" placeholder="ads" /></div>
        </div>
        <label class="small">Description</label><input data-bd="${i}" data-f="desc" value="${esc(b.desc)}" placeholder="What this board is for" />
        <button class="ghost danger" data-bddel="${i}" style="margin-top:6px;padding:4px 10px;">Remove</button>
      </div>`).join("") || `<p class="small muted">No boards yet.</p>`;
    box.querySelectorAll('[data-bd]').forEach(inp=>inp.oninput=()=>{
      const b=boardsState[+inp.dataset.bd], f=inp.dataset.f;
      b[f]=inp.value;
      if(f==="name" && !b._existing && !b._idTouched){ b.id=slugify(inp.value); const idInp=box.querySelector(`[data-bd="${inp.dataset.bd}"][data-f="id"]`); if(idInp) idInp.value=b.id; }
      if(f==="id"){ b._idTouched=true; b.id=slugify(inp.value); }
    });
    box.querySelectorAll('[data-bddel]').forEach(bt=>bt.onclick=()=>{ boardsState.splice(+bt.dataset.bddel,1); drawBoardRows(); });
  }
  drawBoardRows();
  $("a_addBoard").onclick = ()=>{ boardsState.push({id:"",name:"",desc:"",_existing:false}); drawBoardRows(); };
  $("a_save_boards").onclick = async ()=>{
    $("a_status_boards").textContent = "Saving…";
    const ok = await EquiDB.put('config', 'forum', who.userId, { boards: boardsState.map(({_existing,_idTouched,...b})=>b) });
    $("a_status_boards").textContent = ok ? "Saved." : "Failed to save.";
  };

  // ---- Set bonuses: load + save (config/global) ----
  const globalCfg = (await EquiDB.get('config','global')) || {};
  let tackSets = Array.isArray(globalCfg.tackSets) ? globalCfg.tackSets : [];

  function drawSets(){
    const box=$("a_setsList");
    box.innerHTML = tackSets.length ? tackSets.map(set=>{
      const b=set.bonus||{};
      const bstr=[...Object.entries(b.stats||{}).map(([s,v])=>`+${v} ${STAT_LABELS[s]||s}`), b.exp?`+${b.exp} EXP`:''].filter(Boolean).join(" · ");
      return `<div style="border:1px solid var(--equi-line,#333);border-radius:8px;padding:10px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">
          <b>◈ ${esc(set.name)}</b>
          <button class="ghost danger" data-delset="${esc(set.id)}" style="font-size:.9em;padding:3px 8px;">Delete set</button>
        </div>
        <div class="small" style="margin-top:4px;">Bonus when all worn together: <b>${bstr||'none set'}</b></div>
      </div>`;
    }).join("") : `<p class="small muted">No sets yet.</p>`;
    box.querySelectorAll('[data-delset]').forEach(btn=>btn.onclick=async ()=>{
      if(!confirm('Delete this set? Items keep their individual bonuses; they just lose the set link.')) return;
      tackSets = tackSets.filter(s=>s.id!==btn.dataset.delset);
      await EquiDB.put('config', 'global', who.userId, { ...globalCfg, tackSets });
      drawSets();
    });
  }
  drawSets();

  $("a_set_add").onclick = async ()=>{
    const name = $("a_set_name").value.trim();
    if(!name){ alert("Name the set first."); return; }
    const bstats={};
    STATS.forEach(s=>{ const v=Number($("a_set_stat_"+s).value)||0; if(v!==0) bstats[s]=v; });
    const bonus={ stats:bstats, exp:Number($("a_set_exp").value)||0 };
    tackSets.push({ id:'set_'+Math.random().toString(36).slice(2,9), name, bonus });
    const ok = await EquiDB.put('config', 'global', who.userId, { ...globalCfg, tackSets });
    if(ok){ $("a_set_name").value=""; STATS.forEach(s=>{ $("a_set_stat_"+s).value=0; }); $("a_set_exp").value=0; drawSets(); }
    else alert("Failed to save set.");
  };

  // ---- Item Override: search + edit ANY item — real shop items AND the
  // migrated ILB Emporium catalog (two different storage shapes, see
  // listAll vs listAllFlat in equi-core.js). Tagged with __src so the save
  // handler knows which write path to use for each.
  let allItems = [];
  try{
    const shopItems = (await EquiDB.listAll('shopItems')).map(it => ({ ...it, __src: 'shopItems' }));
    const catalogItems = (await EquiDB.listAllFlat('items')).map(it => ({ ...it, __src: 'items', __owner: 'ILB Emporium catalog' }));
    allItems = [...shopItems, ...catalogItems];
  }catch(e){ console.error('[Admin] item load failed:', e); }

  function renderItemResults(filterText){
    const box = $("a_itemResults");
    const q = (filterText||"").trim().toLowerCase();
    const matches = !q ? [] : allItems.filter(it =>
      String(it.name||"").toLowerCase().includes(q) || String(it.__owner||"").toLowerCase().includes(q)
    ).slice(0, 30);

    if(!q){ box.innerHTML = `<p class="small muted">Type to search ${allItems.length} items (shops + migrated catalog).</p>`; return; }
    box.innerHTML = matches.length ? matches.map(it=>`
      <div style="display:flex;justify-content:space-between;align-items:center;border:1px solid var(--equi-line,#333);border-radius:6px;padding:6px 10px;margin-bottom:4px;">
        <span class="small">${esc(it.name)} <span class="muted">— ${esc(it.category||'')} · ${esc(it.__owner||'?')}</span></span>
        <button class="ghost" data-edititem="${esc(it.id)}" style="padding:3px 10px;">Edit</button>
      </div>`).join("") : `<p class="small muted">No matches.</p>`;

    box.querySelectorAll('[data-edititem]').forEach(btn=>btn.onclick=()=>{
      const item = allItems.find(i=>i.id===btn.dataset.edititem);
      if(item) renderItemEditor(item);
    });
  }
  $("a_item_search").oninput = ()=> renderItemResults($("a_item_search").value);
  renderItemResults("");

  function renderItemEditor(item){
    const box = $("a_itemEditor");
    const stats = item.stats || {};
    box.innerHTML = `
      <div style="border:1px solid var(--equi-line,#333);border-radius:8px;padding:12px;">
        <h4 style="margin-top:0;">Editing: ${esc(item.name)} <span class="small muted">(${esc(item.__owner||'?')})</span></h4>
        <label class="small">Name</label><input id="ie_name" value="${esc(item.name||'')}" />
        <label class="small">Category</label><input id="ie_cat" value="${esc(item.category||'')}" />
        <label class="small">Image URL</label><input id="ie_image" value="${esc(item.image||item.imageUrl||'')}" placeholder="https://…" />
        <label class="small">Description</label><textarea id="ie_desc" rows="2">${esc(item.description||item.desc||'')}</textarea>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;">
          <div><label class="small">Price (✦)</label><input id="ie_price" type="number" value="${Number(item.price)||0}" /></div>
          <div><label class="small">Active</label><select id="ie_active"><option value="true" ${item.active!==false?'selected':''}>Yes</option><option value="false" ${item.active===false?'selected':''}>No</option></select></div>
        </div>
        <label class="small" style="margin-top:8px;display:block;">Stats (tack, applied when equipped)</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${STATS.map(s=>`<div style="min-width:78px;"><label class="small">${STAT_LABELS[s]}</label><input type="number" id="ie_stat_${s}" value="${Number(stats[s])||0}" style="width:100%;padding:4px 6px;" /></div>`).join("")}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;">
          <div><label class="small">EXP bonus</label><input id="ie_exp" type="number" value="${Number(item.exp)||0}" /></div>
          <div><label class="small">PP bonus (apparel)</label><input id="ie_pp" type="number" value="${Number(item.pp)||0}" /></div>
          <div><label class="small">Uses (consumables)</label><input id="ie_uses" type="number" value="${Number(item.uses)||0}" /></div>
        </div>
        <label class="small" style="margin-top:8px;display:block;">Part of a set?</label>
        <select id="ie_setId">
          <option value="">— no set —</option>
          ${tackSets.map(s=>`<option value="${esc(s.id)}" ${item.setId===s.id?'selected':''}>${esc(s.name)}</option>`).join("")}
        </select>
        <div style="margin-top:12px;display:flex;gap:8px;">
          <button id="ie_save">Save changes</button>
          <button class="ghost" id="ie_cancel">Cancel</button>
          <span id="ie_status" class="small"></span>
        </div>
      </div>`;

    $("ie_cancel").onclick = ()=>{ box.innerHTML = ""; };
    $("ie_save").onclick = async ()=>{
      $("ie_status").textContent = "Saving…";
      try{
      const newStats = {};
      STATS.forEach(s=>{ const v=Number($("ie_stat_"+s).value)||0; if(v!==0) newStats[s]=v; });
      const imageVal = $("ie_image").value.trim();

      let ok;
      if(item.__src === 'items'){
        // Migrated catalog item — flat schema, direct field write.
        // NOTE: editing the catalog does NOT retroactively change items
        // already granted to players (those are self-contained copies) —
        // this only affects future grants from this catalog entry.
        ok = await EquiDB.setFlat('items', item.id, {
          name: $("ie_name").value.trim(),
          category: $("ie_cat").value.trim(),
          imageUrl: imageVal,
          description: $("ie_desc").value,
          active: $("ie_active").value === "true",
          stats: newStats,
          exp: Number($("ie_exp").value)||0,
          // These four are collected by the editor above but were previously
          // dropped on catalog saves, so editing them appeared to do nothing.
          price: Number($("ie_price").value)||0,
          pp: Number($("ie_pp").value)||0,
          uses: Number($("ie_uses").value)||0,
          setId: $("ie_setId").value || null,
        });
        if(ok){
          const idx = allItems.findIndex(i=>i.id===item.id);
          if(idx>-1) allItems[idx] = { ...allItems[idx], name:$("ie_name").value.trim(), category:$("ie_cat").value.trim(), imageUrl:imageVal, stats:newStats };
        }
      } else {
        const updated = { ...item,
          name: $("ie_name").value.trim(),
          category: $("ie_cat").value.trim(),
          image: imageVal,
          description: $("ie_desc").value,
          price: Number($("ie_price").value)||0,
          active: $("ie_active").value === "true",
          stats: newStats,
          exp: Number($("ie_exp").value)||0,
          pp: Number($("ie_pp").value)||0,
          uses: Number($("ie_uses").value)||0,
          setId: $("ie_setId").value || undefined,
        };
        delete updated.__owner; delete updated.__src; // hoisted/meta fields, not part of the json blob
        // IMPORTANT: preserve the item's ORIGINAL owner (its shop), not the
        // admin's own uid — the admin is editing the item, not taking it over.
        ok = await EquiDB.put('shopItems', item.id, item.__owner, updated);
        if(ok){
          const idx = allItems.findIndex(i=>i.id===item.id);
          if(idx>-1) allItems[idx] = { ...updated, id:item.id, __owner:item.__owner, __src:'shopItems' };
        }
      }
      $("ie_status").textContent = ok ? "Saved." : "Failed — check the console.";
      }catch(err){
        console.error('[Admin] item save failed:', err);
        const perm = err && (err.code === 'permission-denied' || /permission|insufficient/i.test(err.message||''));
        $("ie_status").textContent = perm
          ? "Blocked by the database: an admin can't write an item owned by another account. This needs a Firestore rules change (see console)."
          : ("Failed: " + (err && (err.message||err.code) || err));
      }
    };
  }
}

boot();
</script>
</div>
</body>
</html>
