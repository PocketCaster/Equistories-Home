<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EquiStories — Community Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Lora:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Same responsive root size the Stable Manager and Shows use, so the three
     apps read at identical scale instead of the hub looking shrunken. */
  /* root font-size now comes from equi-shell.css, shared by all pages */

  /* Palette bridges the Hub's dark walnut with the Bank's brass/honey/parchment,
     so the three apps feel like one place. Variable NAMES are unchanged so every
     existing rule keeps working — only the values and the accents are richer. */
  :root{
    --bg:#1a130c; --panel:#241a12; --panel2:#2c2016; --line:#4a3826;
    --text:#f3e9d8; --dim:#c1ad92;
    --accent:#d29a3e; --accent2:#c9a8e8; --good:#8a9e68; --bad:#b5623a; --deep:#140e07;
    --honey:#c8842a; --rust:#9b4f2a; --moss:#5a6e3a;
    --brass-light:#e8c97a; --brass-mid:#c9a84c; --brass-dark:#8a6820;
    --gold-shine:linear-gradient(135deg,#e8c97a 0%,#c9a84c 30%,#f2d97e 50%,#c9a84c 70%,#8a6820 100%);
  }
  /* box-sizing reset lives in equi-shell.css */
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--equi-serif); line-height:1.6; }
  a{ color:var(--accent); }

  /* Frame CSS (floral/starburst standalone frames, plus the new PNG-overlay
     frames) now lives in equi-constants.js, which injects it once and shares
     it with Stable Manager — see injectFrameCSS() there. */

  /* Preserve line breaks/spacing exactly as typed in the About text (and
     status updates / forum posts, same principle) — without this, plain
     browser text-flow collapses consecutive newlines and spaces into one,
     which is what was flattening a typed list into a single line. */
  .profile-about-body{ white-space:pre-wrap; }

  /* header styling lives in equi-shell.css (.equi-hd) — one definition only */
  /* .wrap geometry lives in equi-shell.css, shared by all pages */
  h1{ margin:0; font-family:var(--equi-display); font-weight:700; font-size:clamp(1.8rem,4vw,2.6rem);
      background:var(--gold-shine); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:.5px; }
  .tagline{ color:var(--dim); margin:2px 0 0; font-family:'Caveat',cursive; font-size:1.3rem; }
  nav{ display:flex; gap:4px; flex-wrap:wrap; margin-top:14px; }
  .tab{ padding:9px 18px; border:1px solid var(--line); border-bottom:none;
        border-radius:8px 8px 0 0; cursor:pointer; background:#1e1610; color:var(--dim);
        font-family:var(--equi-display); font-size:.98em; letter-spacing:.02em; }
  .tab.active{ background:var(--gold-shine); color:#241a14; font-weight:700; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; margin:16px 0;
         box-shadow:0 2px 14px rgba(0,0,0,.25), inset 0 0 0 1px rgba(201,168,76,.07); }
  .card h2{ margin:0 0 10px; font-family:var(--equi-display); color:var(--accent); font-size:1.5em; }
  .card h3{ margin:0 0 8px; font-family:var(--equi-display); color:var(--accent); font-size:1.22em; }
  .card h4{ font-family:var(--equi-display); }
  .grid{ display:grid; gap:12px; }
  .small{ font-size:.92em; color:var(--dim); }
  .tag{ display:inline-block; font-size:.9em; padding:3px 9px; border-radius:10px;
        background:var(--deep); color:var(--dim); border:1px solid var(--line); }
  button{ background:linear-gradient(135deg,var(--honey),var(--rust)); color:#fff6ea; border:none; padding:9px 18px; border-radius:6px;
          font-weight:700; cursor:pointer; font-family:var(--equi-display); font-size:1em;
          box-shadow:0 2px 0 rgba(80,32,10,.4), inset 0 1px 0 rgba(255,255,255,.12); }
  button:hover:not(:disabled){ filter:brightness(1.06); }
  button:disabled{ opacity:.6; cursor:not-allowed; }
  button.ghost{ background:#2c2118; color:var(--text); border:1px solid var(--line); box-shadow:none; font-family:var(--equi-serif); font-weight:500; }
  button.ghost:hover{ border-color:var(--brass-mid); filter:none; }
  input, textarea, select{ width:100%; padding:9px; font-size:1em; background:var(--deep); border:1px solid var(--line);
          color:var(--text); border-radius:5px; font-family:var(--equi-serif); }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--brass-mid); box-shadow:0 0 0 2px rgba(201,168,76,.22); }
  label{ font-size:.88em; color:var(--dim); text-transform:uppercase; display:block; margin-top:10px; letter-spacing:.03em; }
  .muted{ opacity:.7; }
  .hide{ display:none !important; }
  .linkbox{ display:block; background:var(--deep); border:1px solid var(--line); border-radius:8px;
            padding:14px; text-decoration:none; color:var(--text); transition:border-color .15s; }
  .linkbox:hover{ border-color:var(--accent); }
  .linkbox b{ color:var(--accent); display:block; font-size:1.1em; }

  /* ── SHOPS TAB ────────────────────────────────────────────── */
  .shop-tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .shop-tile{ border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--deep);
    cursor:pointer; transition:border-color .15s, transform .15s; display:flex; flex-direction:column; }
  .shop-tile:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .shop-tile .banner{ height:120px; background-size:cover; background-position:center;
    background-color:var(--panel2); border-bottom:1px solid var(--line); }
  .shop-tile .banner.noimg{ display:flex; align-items:center; justify-content:center; font-size:2.4em; color:var(--line); }
  .shop-tile .body{ padding:12px 14px; flex:1; display:flex; flex-direction:column; gap:5px; }
  .shop-tile .body b{ font-family:var(--equi-display); color:var(--accent); font-size:1.1em; }

  /* A storefront restyles itself with these locals, so each shop feels custom
     while still living inside the hub. Defaults inherit the hub's palette. */
  .storefront{ --sf-accent:var(--accent); --sf-bg:var(--panel); --sf-panel:var(--deep);
    --sf-text:var(--text); --sf-head:var(--brass-mid); }
  .sf-hero{ border-radius:12px; overflow:hidden; border:1px solid var(--line); margin-bottom:16px;
    background:var(--sf-panel); }
  .sf-hero .banner{ height:180px; background-size:cover; background-position:center; background-color:var(--sf-panel); }
  .sf-hero .banner.noimg{ display:flex; align-items:center; justify-content:center; font-size:3em; color:var(--sf-accent); opacity:.5; }
  .sf-hero .meta{ padding:16px 18px; }
  .sf-hero .meta h2{ margin:0; font-family:var(--equi-display); color:var(--sf-head); }
  .sf-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .sf-item{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--sf-panel);
    display:flex; flex-direction:column; }
  .sf-item .img{ height:150px; background-size:cover; background-position:center; background-color:var(--panel2); }
  .sf-item .img.noimg{ display:flex; align-items:center; justify-content:center; font-size:2em; color:var(--line); }
  .sf-item .pad{ padding:12px; flex:1; display:flex; flex-direction:column; gap:6px; }
  .sf-item .pad .nm{ font-family:var(--equi-display); color:var(--sf-head); font-weight:700; }
  .sf-price{ color:var(--sf-accent); font-family:var(--equi-display); font-weight:700; font-size:1.5rem; margin-top:auto; }
  .sf-buy{ background:var(--sf-accent); color:#1a130c; border:none; padding:7px 14px; border-radius:6px;
    font-family:var(--equi-display); font-weight:700; cursor:pointer; }
  .sf-buy:disabled{ opacity:.5; cursor:not-allowed; }
  .swatch-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .swatch{ display:flex; flex-direction:column; gap:4px; align-items:flex-start; }
  .swatch input[type=color]{ width:52px; height:36px; padding:2px; border:1px solid var(--line);
    border-radius:6px; background:var(--deep); cursor:pointer; }
  .shop-crumb{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }

  /* ── BREEDS TAB ───────────────────────────────────────────── */
  .breed-page{ --sf-accent:var(--accent); --sf-panel:var(--deep); --sf-head:var(--brass-mid); }
  .breed-sub{ display:flex; gap:6px; flex-wrap:wrap; margin:14px 0; }
  .breed-sub .bk-pill{ font-family:var(--equi-display); }
  .imp-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .imp-card{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--sf-panel); display:flex; flex-direction:column; }
  .imp-card .img{ height:170px; background-size:cover; background-position:center; background-color:var(--panel2); }
  .imp-card .img.noimg{ display:flex; align-items:center; justify-content:center; font-size:2.2em; color:var(--line); }
  .imp-card .pad{ padding:12px; flex:1; display:flex; flex-direction:column; gap:6px; }
  .imp-card .nm{ font-family:var(--equi-display); color:var(--sf-head); font-weight:700; }
  .imp-status{ font-size:.82em; padding:2px 8px; border-radius:10px; display:inline-block; width:max-content; }
  .imp-status.available{ background:#22301c; color:var(--good); border:1px solid var(--moss); }
  .imp-status.pending{ background:#332a14; color:var(--brass-light); border:1px solid var(--brass-dark); }
  .imp-status.sold{ background:#2a1a1a; color:var(--dim); border:1px solid var(--line); }
  .reg-row{ display:flex; align-items:center; gap:12px; padding:9px 12px; border:1px solid var(--line);
    border-radius:8px; margin-bottom:6px; background:var(--deep); }
  .reg-row .thumb{ width:40px; height:40px; border-radius:6px; background-size:cover; background-position:center; background-color:var(--panel2); flex:0 0 auto; }

  /* ── BANK TAB ─────────────────────────────────────────────── */
  .eyebrow{ font-family:var(--equi-serif); font-size:1.05rem; letter-spacing:.12em; text-transform:uppercase; color:var(--brass-mid); }
  .bank-hero{ border:1px solid var(--brass-mid);
    background:linear-gradient(180deg,#2a1f14,#20170f);
    box-shadow:0 4px 24px rgba(0,0,0,.35), inset 0 0 0 1px rgba(232,201,122,.15); }
  .bank-hero-row{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .bank-balance{ font-family:var(--equi-display); font-weight:700; font-size:clamp(2.6rem,7vw,3.4rem); line-height:1;
    background:var(--gold-shine); -webkit-background-clip:text; background-clip:text; color:transparent; margin:2px 0 4px; }
  .bank-hero-actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .bk-badge{ display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px;
    border-radius:9px; background:var(--rust); color:#fff; font-family:var(--equi-serif); font-weight:700; font-size:.85rem; }
  .bank-filters{ display:flex; gap:6px; }
  .bk-pill{ padding:4px 14px; border:1px solid var(--line); border-radius:20px; cursor:pointer; font-size:.85rem; color:var(--dim); user-select:none; }
  .bk-pill:hover{ border-color:var(--brass-mid); color:var(--text); }
  .bk-pill.active{ background:var(--gold-shine); color:#241a14; font-weight:700; border-color:var(--brass-dark); }
  .bk-tx{ display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    margin-bottom:8px; background:var(--deep); }
  .bk-tx.in{ border-left:3px solid var(--good); }
  .bk-tx.out{ border-left:3px solid var(--rust); }
  .bk-tx-ic{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--panel); flex:0 0 auto; font-size:1rem; }
  .bk-tx-body{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .bk-tx-body b{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bk-tx-date{ font-family:var(--equi-serif); color:var(--dim); opacity:.75; font-size:.95rem; }
  .bk-tx-amt{ font-family:var(--equi-serif); font-weight:700; font-size:1.35rem; white-space:nowrap; }
  .bk-tx-amt.in{ color:var(--good); }
  .bk-tx-amt.out{ color:var(--rust); }
  .bk-notif{ padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:var(--deep); }
  .bk-notif.unread{ border-color:var(--brass-mid); background:rgba(200,132,42,.09); }
  .bk-notif b{ color:var(--accent); text-transform:capitalize; }
  /* Even action cards: flex column so every button sits on the bottom edge,
     no matter how many fields the card has. */
  .bank-act{ display:flex; flex-direction:column; }
  .bank-act > button{ margin-top:auto; }
  /* Business section */
  .bk-subnav{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .bk-idbox{ background:var(--gold-shine); border:1px solid var(--brass-dark); border-radius:10px;
    padding:14px 16px; text-align:center; margin:12px 0; box-shadow:0 2px 0 var(--brass-dark); }
  .bk-idbox .lab{ font-family:var(--equi-serif); font-size:1rem; text-transform:uppercase; letter-spacing:.1em; color:#3e2b15; opacity:.85; }
  .bk-idbox .val{ font-family:var(--equi-mono); font-size:1.7rem; font-weight:700; color:#241a14; word-break:break-all; line-height:1.15; }
  .bk-idbox .hint{ font-size:.78rem; color:#3e2b15; font-style:italic; opacity:.85; margin-top:4px; }

  /* ============================================
     FORUM — ProBoards-style boards/threads/posts.
     Category header banners, a real stats + last-post table for board and
     thread listings, and a sidebar-style post card for the thread view.
     ============================================ */
  .pb-category{
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    overflow:hidden; margin-bottom:20px; box-shadow:0 6px 18px rgba(0,0,0,.28);
  }
  .pb-category__head{
    background:var(--gold-shine); color:#241a14; padding:12px 20px;
    font-family:var(--equi-display,var(--equi-serif)); font-weight:700; font-size:1.2em;
    letter-spacing:.02em; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--brass-dark);
  }
  .pb-category__head .small{ color:#3e2b15; font-weight:500; opacity:.9; }
  .pb-colheads{
    display:grid; grid-template-columns:56px 1fr 100px 260px; gap:14px;
    padding:8px 20px; font-size:.78em; text-transform:uppercase; letter-spacing:.08em;
    color:var(--dim); background:rgba(0,0,0,.15); border-bottom:1px solid var(--line);
  }
  .pb-colheads span:nth-child(3){ text-align:center; }
  .pb-row{
    display:grid; grid-template-columns:56px 1fr 100px 260px;
    gap:14px; align-items:center; padding:14px 20px;
    border-top:1px solid var(--line); cursor:pointer; transition:background .15s;
  }
  .pb-row:first-child{ border-top:none; }
  .pb-row:hover{ background:rgba(201,168,76,.09); }
  .pb-icon{
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:1.35em; background:var(--deep);
    border:2px solid var(--line); flex:0 0 auto;
  }
  .pb-row.pinned .pb-icon{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(201,168,76,.16); }
  .pb-title{ font-family:var(--equi-display,var(--equi-serif)); font-weight:700; font-size:1.08em; color:var(--text); line-height:1.3; }
  .pb-desc{ color:var(--dim); font-size:.92em; margin-top:3px; line-height:1.4; }
  .pb-meta{ color:var(--dim); font-size:.85em; margin-top:5px; }
  .pb-stats{ text-align:center; color:var(--dim); font-size:.85em; line-height:1.35; }
  .pb-stats b{ display:block; color:var(--brass-light); font-size:1.35em; font-family:var(--equi-display,var(--equi-serif)); font-weight:700; }
  .pb-lastpost{ display:flex; align-items:center; gap:10px; font-size:.85em; color:var(--dim); min-width:0; }
  .pb-lastpost img, .pb-lastpost .pb-avatar-fallback{
    width:36px; height:36px; border-radius:8px; object-fit:cover; flex:0 0 auto;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; background:var(--deep);
  }
  .pb-lp-info{ min-width:0; }
  .pb-lp-info .pb-lp-title{ color:var(--brass-light); font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pb-lp-info .pb-lp-who{ color:var(--text); }
  .pb-empty-lastpost{ color:var(--faint,var(--dim)); font-style:italic; font-size:.85em; }
  .pb-pin-tag{ color:var(--accent); font-weight:700; margin-right:4px; }
  .pb-newthread-bar{
    display:flex; justify-content:flex-end; margin-bottom:10px;
  }
  @media (max-width: 760px){
    .pb-colheads{ display:none; }
    .pb-row{ grid-template-columns:44px 1fr; }
    .pb-stats, .pb-lastpost{ display:none; }
  }

  /* Thread page — sidebar-style post card, classic forum layout */
  .pb-post{
    display:grid; grid-template-columns:160px 1fr;
    border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:16px;
    background:var(--panel2);
  }
  .pb-post__side{
    background:var(--panel); padding:18px 14px; text-align:center;
    border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center;
  }
  .pb-post__side .equi-frame, .pb-post__side .equi-frame-img, .pb-post__side .equi-frame-standalone{ margin:0 auto; }
  .pb-post__name{ margin-top:10px; font-weight:700; font-family:var(--equi-display,var(--equi-serif)); word-break:break-word; }
  .pb-post__badges{ margin-top:4px; }
  .pb-post__body{ padding:18px 22px; min-width:0; }
  .pb-post__meta{
    font-size:.85em; color:var(--dim); border-bottom:1px solid var(--line);
    padding-bottom:10px; margin-bottom:12px; display:flex; justify-content:space-between;
    flex-wrap:wrap; gap:6px; align-items:baseline;
  }
  @media (max-width:640px){
    .pb-post{ grid-template-columns:1fr; }
    .pb-post__side{ border-right:none; border-bottom:1px solid var(--line); flex-direction:row; text-align:left; gap:10px; }
    .pb-post__name{ margin-top:0; }
  }
</style>
  <link rel="stylesheet" href="equi-shell.css" />
  <link rel="stylesheet" href="equi-components.css" />

<body>
<!-- ============================================================
     SHARED SITE HEADER — plain HTML on purpose.
     This is real markup, not generated by JavaScript, so the wordmark, the
     tagline, the links across the site and the tab row all still work if a
     script fails to load or a file is missing. equi-nav.js only ENHANCES it
     (fills the tab row on this page, wires Sign out).
     ============================================================ -->
<header class="equi-hd">
  <div class="equi-hd__wrap">
    <div class="equi-hd__brand">
      <a href="index.html" aria-label="EquiStories home">
        <img class="equi-hd__logo" src="equistories-logo.png" alt=""
             onerror="this.style.display='none'" />
      </a>
      <div class="equi-hd__words">
        <h1 class="equi-hd__title">EquiStories</h1>
        <p class="equi-hd__tagline">An art-driven horse roleplay community — draw, train, compete, breed.</p>
      </div>
    </div>
    <nav id="nav" class="equi-hd__nav"></nav>
  </div>
</header>
<script src="equi-nav.js" data-app="hub"></script>


<script src="equi-constants.js"></script>
<script src="equi-bank.js"></script>

<script>
window.__equiDBReady = new Promise(r => { window.__equiDBResolve = r; });
</script>
<script type="module" src="equi-core.js"></script>


<main class="wrap" id="view" style="padding-bottom:60px;"></main>

<script>
(function(){
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Apps Script bank is fully retired — everything now goes through
// railwayCall() (from equi-bank.js). Nothing in this file talks to Google
// Sheets/Apps Script anymore.

// All three pages now live in this repo, so these are plain relative paths.
// (They used to be absolute URLs to the old separate repos — which, after
// consolidation, meant every cross-link took a redirect round-trip.)
const APPS = {
  stable: "stable.html",
  shows:  "shows.html",
};

const DEFAULT_DISCORD = "https://discord.gg/54nC2p2qp9";
// STATS, STAT_LABELS, ADMIN_MEMBERS, RAILWAY_URL now come from
// equi-constants.js; railwayCall()/upgradeToOwnerSession() from equi-bank.js.
// Both load before this script — see <head>.
const statTotal = h => STATS.reduce((n,k)=>n+(Number(h.stats&&h.stats[k])||0), 0);
const imgOk = u => typeof u==='string' && u && !u.startsWith('data:');
const TABS = ["Home","Bank","Shops","Breeds","Members","Community","Messages","Forum"];
let tab = "Home";

async function waitForDB(ms=8000){
  try{ await Promise.race([window.__equiDBReady||Promise.resolve(false),
                           new Promise(r=>setTimeout(()=>r(false),ms))]); }catch(e){}
  return (window.EquiDB && window.EquiDB.available) ? window.EquiDB : null;
}
function me(){
  return equiSession(); // from equi-constants.js — same localStorage key, one implementation
}
// Fetches a fresh Firebase idToken for calling the Railway bank server.
// MUST be global: it's called from status updates, forum @mentions, sign-in/
// linking, transfers, deposits, business payments — everywhere railwayCall()
// is used. It used to be defined only inside renderBank(), so every one of
// those other call sites threw "idToken is not defined" the moment they ran
// (the status-update/forum-mention ones swallowed it as a generic "Failed:"
// message; sign-in showed it as "Couldn't reach the bank server").
async function idToken(){ try{ await window.EquiAuth.ready; return await window.EquiAuth.token(); }catch(e){ return null; } }

// So people show up on the Members list the moment they sign in, even if they've
// never opened the Stable Manager to fill out a profile. Only creates a stub —
// never overwrites a profile that already exists. Shape matches Stable Manager's
// newPlayerProfile() so it merges cleanly if they later edit it there.
async function ensureProfile(userId){
  try{
    const DB = await waitForDB();
    if(!DB) return;
    const existing = await DB.get('profiles', userId);
    if(existing) return;
    await DB.put('profiles', userId, userId, {
      displayName: userId, pronouns:"", avatar: "", bio:"", discord: "", links: [],
      joinedAt: new Date().toISOString()
    });
    console.log('[Hub] auto-created blank profile for', userId);
  }catch(e){ console.warn('[Hub] ensureProfile failed:', e); }
}

  const art = (h.artLog||[]).filter(e=>imgOk(e.image));

    ? `<div style="display:flex;gap:8px;overflow-x:auto;padding:4px 0;">`
      + art.slice(0,10).map(e=>`

function tabJump(t){ const el=document.querySelector(`[data-tab="${t}"]`); if(el) el.click(); }

function showRow(rec){
  const s=rec.show||{};
  const entries=(rec.entries||[]).length;
  const closed=s.status==='closed';
  return `<div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--deep);">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;">
      <b style="color:var(--accent);">${__esc(s.title||'Untitled show')}</b>

    <div class="small">${__esc(s.discipline||'')} · closes ${__esc(s.closesAt||'—')} · ${entries} ${entries===1?'entry':'entries'}${s.hostId?` · hosted by ${__esc(s.hostId)}`:''}</div>
    <div style="margin-top:6px;"><a href="${__APPS.shows}?show=${encodeURIComponent(rec.__id||s.id||'')}">Open show →</a></div>
  </div>`;
}

  let allTx=[], txFilter='all';
  const TX_ICON = t => ({
    deposit:'💰', transfer:t.direction==='in'?'📨':'📤', transfer_in:'📨', transfer_out:'📤',
    pay_business:'🏪', business_refund:'↩️', refund_received:'↩️', show:'🏆', work:'🔨',
    trail:'🌿', item:'🎁', show_hold:'🎗️', show_refund:'↩️'
  }[t.type] || '✦');
  function drawHist(){
    const list = allTx.filter(t=> txFilter==='all' ? true : t.direction===txFilter).slice(0,25);
    if(!list.length){ $("bkHist").innerHTML='<span class="muted">Nothing here yet.</span>'; return; }
    $("bkHist").innerHTML = list.map(t=>{
      const sign = t.direction==='in'?'+':'−';
      const cls  = t.direction==='in'?'in':'out';
      const d = t.timestamp ? new Date(t.timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
      return `<div class="bk-tx ${cls}">
        <span class="bk-tx-ic">${TX_ICON(t)}</span>
        <span class="bk-tx-body">
          <b>${esc(t.label||t.type)}</b>
          ${t.note?`<span class="muted small">"${esc(t.note)}"</span>`:''}
          <span class="bk-tx-date">${d}</span>
        </span>
        <span class="bk-tx-amt ${cls}">${sign}฿${(parseFloat(t.amount)||0).toLocaleString()}</span>
      </div>`;
    }).join('');
  }
  async function loadHist(){
    const token = await idToken();
    const r = await railwayCall('/getTransactionHistory', { method:'GET', idToken: token });
    allTx = (r && r.success) ? (r.data||[]) : [];
    drawHist();
  }

  async function loadNotifs(){
    const token = await idToken();
    const r = await railwayCall('/getNotifications', { method:'GET', idToken: token });
    const ns = (r && r.success) ? (r.data||[]) : [];
    const unread = ns.filter(n=>!n.read).length;
    const badge = $("bkUnread");
    if(unread>0){ badge.textContent = unread>99?'99+':unread; badge.classList.remove('hide'); }
    else badge.classList.add('hide');
    $("bkNotifList").innerHTML = ns.length
      ? ns.slice(0,30).map(n=>`
          <div class="bk-notif ${n.read?'':'unread'}">
            <div><b>${esc((n.type||'').replace(/_/g,' '))}</b></div>
            <div>${esc(n.message)}</div>
          </div>`).join('')
      : '<span class="muted">No notifications yet.</span>';
  }

  // --- wiring ---
  $("bkRefresh").onclick = ()=>{ loadBalance(); loadHist(); loadNotifs(); };
  $("bkBell").onclick    = ()=>{ $("bkNotifs").classList.toggle('hide'); };
  $("bkMarkAll").onclick = async ()=>{ const token=await idToken(); await railwayCall('/markNotificationsRead', { idToken: token, body:{} }); loadNotifs(); };

  $("bkFilters").onclick = e=>{
    const p=e.target.closest('.bk-pill'); if(!p) return;
    document.querySelectorAll('#bkFilters .bk-pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active'); txFilter=p.dataset.f; drawHist();
  };

  $("bkSend").onclick = async ()=>{
    const toUserId=$("bkToUser").value.trim(), amount=parseFloat($("bkToAmt").value), note=$("bkToNote").value.trim();
    if(!toUserId||!amount){ say('bkSendMsg','Enter a User ID and amount.','bad'); return; }
    const btn=$("bkSend"); btn.disabled=true; say('bkSendMsg','Sending…');
    const token=await idToken();
    if(!token){ say('bkSendMsg','Session expired — sign out and back in.','bad'); btn.disabled=false; return; }
    const r=await railwayCall('/transferBuxx', { idToken: token, body:{ toUserId, amount, note } });
    btn.disabled=false;
    if(r&&r.success){ say('bkSendMsg',`Sent ${fmtBuxx(amount)} to ${toUserId}.`,'good');
      $("bkToUser").value='';$("bkToAmt").value='';$("bkToNote").value=''; loadBalance(); loadHist(); }
    else say('bkSendMsg',(r&&r.error)||'Could not send.','bad');
  };

  $("bkPay").onclick = async ()=>{
    const businessName=$("bkBizName").value.trim(), amount=parseFloat($("bkBizAmt").value), note=$("bkBizNote").value.trim();
    if(!businessName||!amount){ say('bkPayMsg','Enter a business name and amount.','bad'); return; }
    const btn=$("bkPay"); btn.disabled=true; say('bkPayMsg','Paying…');
    const token=await idToken();
    if(!token){ say('bkPayMsg','Session expired — sign out and back in.','bad'); btn.disabled=false; return; }
    const r=await railwayCall('/payBusiness', { idToken: token, body:{ businessName, amount, note } });
    btn.disabled=false;
    if(r&&r.success){ say('bkPayMsg',`Paid ${fmtBuxx(amount)} to ${businessName}.`,'good');
      $("bkBizName").value='';$("bkBizAmt").value='';$("bkBizNote").value=''; loadBalance(); loadHist(); }
    else say('bkPayMsg',(r&&r.error)||'Could not pay.','bad');
  };

  $("bkDep").onclick = async ()=>{
    const amount=parseFloat($("bkDepAmt").value), proofUrl=$("bkDepProof").value.trim(), description=$("bkDepDesc").value.trim();
    if(!amount||!proofUrl){ say('bkDepMsg','Enter an amount and a proof link.','bad'); return; }
    const btn=$("bkDep"); btn.disabled=true; say('bkDepMsg','Submitting…');
    const token=await idToken();
    const r=await railwayCall('/submitDeposit', { idToken: token, body:{ userId: who.userId, amount, proofUrl, description } });
    btn.disabled=false;
    if(r&&r.success){ say('bkDepMsg',`Deposit of ${fmtBuxx(amount)} submitted.`,'good');
      $("bkDepAmt").value='';$("bkDepProof").value='';$("bkDepDesc").value=''; loadBalance(); loadHist(); }
    else say('bkDepMsg',(r&&r.error)||'Could not submit.','bad');
  };

  // --- business accounts ---
  const idBox = (lab,val,hint)=>`<div class="bk-idbox"><div class="lab">${esc(lab)}</div><div class="val">${esc(val)}</div>${hint?`<div class="hint">✦ ${esc(hint)} ✦</div>`:''}</div>`;

  $("bkBizNav").onclick = e=>{
    const p=e.target.closest('.bk-pill'); if(!p) return;
    document.querySelectorAll('#bkBizNav .bk-pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    const map={create:'bkBizCreate', balance:'bkBizBalance', refund:'bkBizRefund'};
    Object.values(map).forEach(id=>$(id).classList.add('hide'));
    $(map[p.dataset.b]).classList.remove('hide');
  };

  $("bkNewBiz").onclick = async ()=>{
    const businessName=$("bkNewBizName").value.trim();
    const passcode=$("bkNewBizPass").value, confirm=$("bkNewBizPass2").value;
    if(!businessName){ say('bkNewBizMsg','Name your business.','bad'); return; }
    if(!passcode||passcode.length<4){ say('bkNewBizMsg','Passcode must be at least 4 characters.','bad'); return; }
    if(passcode!==confirm){ say('bkNewBizMsg','Passcodes do not match.','bad'); return; }
    const btn=$("bkNewBiz"); btn.disabled=true; say('bkNewBizMsg','Creating…');
    const token=await idToken();
    if(!token){ say('bkNewBizMsg','Session expired — sign out and back in.','bad'); btn.disabled=false; return; }
    const r=await railwayCall('/createBusinessAccount', { idToken: token, body:{ businessName, passcode } });
    btn.disabled=false;
    if(r&&r.success){
      say('bkNewBizMsg','Business created — save your ID below.','good');
      $("bkNewBizName").value='';$("bkNewBizPass").value='';$("bkNewBizPass2").value='';
      $("bkNewBizOut").innerHTML = idBox('Your Business ID', r.businessId, 'Write this down — you need it for balance checks & refunds');
    } else say('bkNewBizMsg',(r&&r.error)||'Could not create.','bad');
  };

  $("bkBizBal").onclick = async ()=>{
    const businessId=$("bkBizId").value.trim();
    if(!businessId){ say('bkBizBalMsg','Enter a Business ID.','bad'); return; }
    say('bkBizBalMsg','Checking…'); $("bkBizBalOut").innerHTML='';
    const r=await railwayCall('/getBusinessBalance?businessId='+encodeURIComponent(businessId), { method:'GET' });
    if(r&&r.success){ say('bkBizBalMsg','');
      $("bkBizBalOut").innerHTML = `<div class="bk-idbox"><div class="lab">${esc(r.businessName)}</div><div class="val">${fmtBuxx(r.balance)}</div></div>`;
    } else say('bkBizBalMsg',(r&&r.error)||'Not found.','bad');
  };

  $("bkLookup").onclick = async ()=>{
    const businessName=$("bkLookupName").value.trim(), passcode=$("bkLookupPass").value;
    if(!businessName||!passcode){ say('bkLookupMsg','Enter the name and passcode.','bad'); return; }
    say('bkLookupMsg','Looking up…'); $("bkLookupOut").innerHTML='';
    const r=await railwayCall('/lookupBusinessId', { body:{ businessName, passcode } });
    if(r&&r.success){ say('bkLookupMsg','');
      $("bkLookupOut").innerHTML = idBox(r.businessName, r.businessId, 'Your Business ID'); }
    else say('bkLookupMsg',(r&&r.error)||'No match.','bad');
  };

  $("bkRefund").onclick = async ()=>{
    const businessId=$("bkRefBizId").value.trim(), passcode=$("bkRefPass").value;
    const toUserId=$("bkRefUser").value.trim(), amount=parseFloat($("bkRefAmt").value), note=$("bkRefNote").value.trim();
    if(!businessId||!passcode||!toUserId||!amount){ say('bkRefundMsg','Fill in Business ID, passcode, player and amount.','bad'); return; }
    const btn=$("bkRefund"); btn.disabled=true; say('bkRefundMsg','Refunding…');
    const r=await railwayCall('/businessTransfer', { body:{ businessId, passcode, toUserId, amount, note: note||'Refund from business' } });
    btn.disabled=false;
    if(r&&r.success){ say('bkRefundMsg',`Refunded ${fmtBuxx(amount)} to ${toUserId}.`,'good');
      $("bkRefAmt").value='';$("bkRefNote").value=''; loadHist(); }
    else say('bkRefundMsg',(r&&r.error)||'Could not refund.','bad');
  };

  loadBalance(); loadHist(); loadNotifs();
}

// ============================================================
//  MEMBERS
// ============================================================
// ============================================================
//  MEMBER PROFILE — the canonical one for the whole site.
//
//  This used to live in the Stable Manager, and the Hub linked OUT to it, so
//  clicking a member's name threw you out of the community into the tracker
//  and there was no way back. The profile belongs here: it's the social layer,
//  and everything it shows (profiles / horses / riders) is world-readable.
//
//  Reached as ?player=<userId> from anywhere on the site, so a profile link is
//  the same URL no matter which page produced it.
// ============================================================
let __memberView = { uid: null };

function memberHref(uid){ return "?player=" + encodeURIComponent(uid); }

// Editing your own profile happens HERE now, not in a modal over in the
// tracker. Same field set the tracker's modal used, so nothing is lost and
// existing profiles load unchanged.
let __memberEdit = { on:false, links:null };

// EQUI_FRAMES, frameClass(), framedImg() now come from equi-constants.js,
// shared with Stable Manager so horse/rider profiles can offer the same
// frame picker (including the new PNG-overlay frames) as player profiles.

function newHubProfile(){
  return { displayName:"", pronouns:"", avatar:"", discord:"", bio:"", about:"",
           frame:"none", customCss:"", links:[], joinedAt:"" };
}

async function saveMemberProfile(uid, prof){
  const DB = await __waitForDB();
  if(!DB) return false;
  try{ await DB.put('profiles', uid, uid, prof); return true; }
  catch(e){ console.error('[Hub] saveProfile failed:', e); return false; }
}

function renderMemberEditor(v, uid, p, mine, theirs){
  const links = __memberEdit.links || (Array.isArray(p.links)? p.links.map(l=>({...l})) : []);
  __memberEdit.links = links;
  mine = mine || []; theirs = theirs || [];

  v.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0;">My profile</h2>
      <p class="small">Your public community profile — it shows your horses, riders and how to reach you. Account name: <b>${__esc(uid)}</b>.</p>

      <label for="mp_banner">Banner image link (optional)</label>
      <input id="mp_banner" value="${__esc(p.banner||'')}" placeholder="https://…/banner.png (wide image works best)" />

      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));">
        <div><label for="mp_name">Display name (optional)</label>
          <input id="mp_name" value="${__esc(p.displayName||'')}" placeholder="${__esc(uid)}" /></div>
        <div><label for="mp_pronouns">Pronouns (optional)</label>
          <input id="mp_pronouns" value="${__esc(p.pronouns||'')}" placeholder="She/Her" /></div>
      </div>

      <label for="mp_avatar">Avatar image link (optional)</label>
      <input id="mp_avatar" value="${__esc(p.avatar||'')}" placeholder="https://…/portrait.png" />
      <div id="mp_avatar_prev" style="margin-top:8px;"></div>
      <p class="small muted">This must be a direct link to the image file — one ending in .png or .jpg — not the gallery page it sits on.</p>

      <label for="mp_discord">Discord (username or invite/profile link)</label>
      <input id="mp_discord" value="${__esc(p.discord||'')}" placeholder="yourname" />

      <label for="mp_frame">Portrait frame</label>
      <select id="mp_frame">${frameOptionsHtml(p.frame, uid)}</select>
      <div id="mp_frame_prev" style="margin-top:8px;"></div>

      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:8px;">
        <div><label for="mp_feathorse">Featured horse <span class="small muted">(shown on your About tab)</span></label>
          <select id="mp_feathorse"><option value="">— none —</option>${mine.map(h=>`<option value="${esc(h.id)}"${p.featuredHorseId===h.id?' selected':''}>${esc(h.name||'Unnamed')}</option>`).join("")}</select></div>
        <div><label for="mp_featrider">Featured rider</label>
          <select id="mp_featrider"><option value="">— none —</option>${theirs.map(r=>`<option value="${esc(r.id)}"${p.featuredRiderId===r.id?' selected':''}>${esc(r.name||'Unnamed')}</option>`).join("")}</select></div>
      </div>

      <label for="mp_bio">Tagline <span class="small muted">(one line, shown under your name)</span></label>
      <input id="mp_bio" value="${__esc(p.bio||'')}" placeholder="Artist, horse hoarder, perpetual WIP" />

      <label for="mp_about">About me <span class="small muted">(the long version — basic HTML and images allowed)</span></label>
      <textarea id="mp_about" style="min-height:200px;font-family:var(--equi-mono);font-size:.9em;" placeholder="Write about yourself…

You can use simple HTML:
  &lt;p&gt;a paragraph&lt;/p&gt;
  &lt;b&gt;bold&lt;/b&gt;  &lt;i&gt;italic&lt;/i&gt;
  &lt;img src=&quot;https://…/picture.png&quot;&gt;
  &lt;h3&gt;a heading&lt;/h3&gt;

Scripts, iframes and forms are stripped for everyone's safety.">${__esc(p.about||'')}</textarea>
      <div class="small muted" style="margin-top:4px;">Images need a <b>direct link</b> to the file (ending .png/.jpg/.gif), same as everywhere else on the site.</div>

      <label>Links (DeviantArt, Toyhouse, Instagram, Bluesky, etc.)</label>
      <div id="mp_links"></div>
      <button class="ghost" id="mp_addlink" style="margin-top:6px;">+ Add link</button>

      ${isPremiumMember(uid) ? `
      <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px;">
        <label for="mp_css">Custom CSS <span class="small" style="color:var(--accent);">&#9733; Premium</span></label>
        <div class="small muted" style="margin:2px 0 6px;">Prefix your selectors with <code>.profile-custom</code> — the same way
          shop CSS works — so your styling stays on your profile and can't reach the rest of the site. Google Fonts
          <code>@import</code> is allowed; scripts and other imports are stripped.
          <br>Hooks you can target: <code>.profile-head</code>, <code>.profile-tagline</code>,
          <code>.profile-links</code>, <code>.profile-about</code>, <code>.profile-about-body</code>, <code>.card</code>.</div>
        <textarea id="mp_css" rows="10" style="font-family:var(--equi-mono);font-size:.9em;" placeholder=".profile-custom .profile-head{ background:#20160f; }&#10;.profile-custom .profile-tagline{ color:#e8c97a; }&#10;.profile-custom .profile-about-body{ line-height:1.8; }">${__esc(p.customCss||'')}</textarea>
      </div>` : `
      <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px;">
        <div class="small muted">&#9733; <b>Custom CSS</b> is a premium perk — premium members can restyle their profile page.</div>

      <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">

        <span class="small" id="mp_msg"></span>

    </div>`;

  function drawFramePreview(){
    const host=v.querySelector('#mp_frame_prev'); if(!host) return;
    const url=(v.querySelector('#mp_avatar')||{value:''}).value.trim();
    const fr=(v.querySelector('#mp_frame')||{value:'none'}).value;
    host.innerHTML = framedImg(url, fr, 140, (v.querySelector('#mp_name')||{value:''}).value.trim() || uid);
  }
  function drawPreview(){
    drawFramePreview();
    const url=v.querySelector('#mp_avatar').value.trim();
    v.querySelector('#mp_avatar_prev').innerHTML = url
      ? `<img src="${__esc(url)}" referrerpolicy="no-referrer" onerror="this.style.display='none'"
             style="width:130px;height:130px;object-fit:cover;border-radius:8px;border:1px solid var(--accent);" />`
      : "";
  }
  function drawLinks(){
    v.querySelector('#mp_links').innerHTML = links.map((l,i)=>`
      <div class="row" style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">
        <input data-lk="${i}" value="${__esc(l.label||'')}" placeholder="Label" style="flex:0 0 150px;" />
        <input data-lu="${i}" value="${__esc(l.url||'')}" placeholder="https://…" style="flex:1;min-width:180px;" />
        <button class="ghost" data-lx="${i}">✕</button>
      </div>`).join("");
    v.querySelectorAll('[data-lk]').forEach(i=>i.oninput=()=>{ links[+i.dataset.lk].label=i.value; });
    v.querySelectorAll('[data-lu]').forEach(i=>i.oninput=()=>{ links[+i.dataset.lu].url=i.value; });
    v.querySelectorAll('[data-lx]').forEach(b=>b.onclick=()=>{ links.splice(+b.dataset.lx,1); drawLinks(); });
  }
  drawPreview(); drawLinks();
  v.querySelector('#mp_avatar').oninput = drawPreview;
  const fsel=v.querySelector('#mp_frame'); if(fsel) fsel.onchange = drawFramePreview;
  v.querySelector('#mp_addlink').onclick = ()=>{ links.push({label:"",url:""}); drawLinks(); };
  v.querySelector('#mp_cancel').onclick  = ()=>{ __memberEdit={on:false,links:null}; renderMemberProfile(v, uid); };

  v.querySelector('#mp_save').onclick = async ()=>{
    const msg=v.querySelector('#mp_msg');
    msg.textContent="Saving…";
    const next = { ...newHubProfile(), ...p,
      displayName: v.querySelector('#mp_name').value.trim(),
      pronouns:    v.querySelector('#mp_pronouns').value.trim(),
      avatar:      v.querySelector('#mp_avatar').value.trim(),
      banner:      (v.querySelector('#mp_banner')||{value:''}).value.trim(),
      discord:     v.querySelector('#mp_discord').value.trim(),
      bio:         v.querySelector('#mp_bio').value.trim(),
      about:       (v.querySelector('#mp_about')||{value:p.about||''}).value,
      frame:       frameAllowed((v.querySelector('#mp_frame')||{value:p.frame||'none'}).value, uid)
                     ? (v.querySelector('#mp_frame')||{value:p.frame||'none'}).value : 'none',
      featuredHorseId: (v.querySelector('#mp_feathorse')||{value:''}).value || null,
      featuredRiderId: (v.querySelector('#mp_featrider')||{value:''}).value || null,
      customCss:   isPremiumMember(uid) ? (v.querySelector('#mp_css')||{value:''}).value : (p.customCss||''),
      links: links.filter(l=>(l.label||l.url)).map(l=>({label:(l.label||'').trim(), url:(l.url||'').trim()})),
      joinedAt: p.joinedAt || new Date().toISOString(),
    };
    const ok = await saveMemberProfile(uid, next);
    if(ok){ __memberEdit={on:false,links:null}; renderMemberProfile(v, uid); }
    else { msg.textContent="Couldn't save — try again."; }
  };
}

let __profileTab = "About";

async function renderMemberProfile(v, uid){
  v.innerHTML = `<div class="card"><div class="small">Loading ${__esc(uid)}…</div></div>`;
  const DB = await __waitForDB();
  if(!DB){ v.innerHTML='<div class="card"><div class="small">Database unavailable.</div></div>'; return; }

  const [prof, horses, riders] = await Promise.all([
    DB.get('profiles', uid).catch(()=>null),
    DB.listAll('horses').catch(()=>[]),
    DB.listAll('riders').catch(()=>[]),
  ]);
  const mine   = horses.filter(h=>h.__owner===uid);
  const theirs = riders.filter(r=>r.__owner===uid);
  const p      = prof || {};
  const name   = (p.displayName||'').trim() || uid;
  const who    = me();
  const isSelf = who && who.userId === uid;

  if(isSelf && __memberEdit.on){ renderMemberEditor(v, uid, p, mine, theirs); return; }

  const premium = isPremiumMember(uid);
  const customCss = (premium && p.customCss) ? sanitizeShopCss(p.customCss) : "";

  const featuredHorse = mine.find(h=>h.id===p.featuredHorseId) || null;
  const featuredRider = theirs.find(r=>r.id===p.featuredRiderId) || null;

  // Use the member's chosen frame (this was accidentally dropped when the
  // avatar got rebuilt as a plain circle — restoring it here). When no
  // frame is picked ("none"), fall back to a clean circle so it still
  // matches the DeviantArt-style header even for members who never set one.
  const circleAvatar = (!p.frame || p.frame==='none')
    ? (p.avatar
        ? `<img src="${__esc(p.avatar)}" referrerpolicy="no-referrer" alt="${__esc(name)}"
             style="width:min(300px,55vw);height:min(300px,55vw);border-radius:50%;object-fit:cover;border:4px solid var(--accent,#c9a84c);flex:0 0 auto;" />`
        : `<div style="width:min(300px,55vw);height:min(300px,55vw);border-radius:50%;border:4px solid var(--accent,#c9a84c);display:flex;align-items:center;justify-content:center;font-size:4.5em;background:var(--deep,#1a1208);flex:0 0 auto;">&#128100;</div>`)
    : framedImg(p.avatar, p.frame, 'min(300px,55vw)', name);

  const statBlock = (num, label)=>`<div style="text-align:center;"><div style="font-size:1.1em;font-weight:bold;color:var(--accent,#e8c766);">${num}</div><div style="font-size:.72em;color:var(--dim,#8a7860);">${label}</div></div>`;

  // The banner is a TRUE background behind the whole name/tagline/buttons
  // block (not a separate strip above it) — image fills the entire area,
  // with only a light gradient layered on top for text contrast, not a
  // near-solid brown block hiding most of it.
  const headerInnerHtml = `
    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;">
      ${circleAvatar}
      <div style="flex:1;min-width:250px;">
        <h2 style="margin:0;text-shadow:${p.banner?'0 1px 4px rgba(0,0,0,.8);':'none'}">${__esc(name)}${premiumBadge(uid)}${adminBadge(uid)}</h2>
        <div class="small muted" style="text-shadow:${p.banner?'0 1px 3px rgba(0,0,0,.8);':'none'}">${__esc(uid)}${p.pronouns?` &middot; ${__esc(p.pronouns)}`:''}</div>
        ${p.bio?`<p class="profile-tagline" style="margin:8px 0 0;font-family:'Caveat',cursive;font-size:1.25rem;color:${p.banner?'#f0e6d2':'var(--dim)'};text-shadow:${p.banner?'0 1px 4px rgba(0,0,0,.8);':'none'}">${__esc(p.bio)}</p>`:''}

// ---- Status Updates: short posts on a member's profile, Twitter-style ----
async function renderStatusUpdates(body, DB, profileUid, who, isSelf){
  let posts = [];
  try{ posts = (await DB.listAll('statusUpdates')).filter(p=>p.owner===profileUid); }catch(e){}
  // __id is the real Firestore document id (always correct); id is whatever
  // was in the saved payload, which was missing entirely for posts made
  // before this fix. Preferring __id here repairs those old posts too,
  // instead of only fixing deletes for posts created from now on.
  posts.forEach(p=>{ if(p.__id) p.id = p.__id; });
  posts.sort((a,b)=> new Date(b.createdAt||0) - new Date(a.createdAt||0));

  body.innerHTML = `
    ${isSelf ? `<div class="card">
      <textarea id="su_body" rows="2" maxlength="1000" placeholder="What's happening in your stable?"></textarea>
      <div style="margin-top:8px;"><button id="su_post">Post</button> <span id="su_msg" class="small"></span></div>
    </div>` : ''}
    <div id="su_list">${posts.length ? '' : '<div class="card"><span class="small muted">No status updates yet.</span></div>'}</div>`;

  if($("su_post")) $("su_post").onclick = async ()=>{
    const text = ($("su_body").value||"").trim();
    if(!text){ $("su_msg").textContent = "Write something first."; return; }
    $("su_msg").textContent = "Posting…";
    const postId = 'su_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    try{
      await DB.put('statusUpdates', postId, who.userId, {
        id: postId, owner: who.userId, text, createdAt: new Date().toISOString()
      });
      const token = await idToken();
      for(const uname of extractMentions(text)){
        try{ await railwayCall('/notifyMention', { idToken: token, body:{ toUserId: uname, threadId: profileUid, threadTitle: 'a status update', boardId: null } }); }catch(e){}
      }
      $("su_body").value=""; renderStatusUpdates(body, DB, profileUid, who, isSelf);
    }catch(err){ $("su_msg").textContent = "Failed: "+(err.message||err); }
  };

  const list = $("su_list");
  if(!list || !posts.length) return;

  const authorProfile = await DB.get('profiles', profileUid).catch(()=>({}));
  const av = (authorProfile.avatar)
    ? `<img src="${__esc(authorProfile.avatar)}" referrerpolicy="no-referrer" style="width:32px;height:32px;border-radius:50%;object-fit:cover;" />`
    : `<div style="width:32px;height:32px;border-radius:50%;background:var(--panel,#1a1410);"></div>`;
  const displayName = (authorProfile.displayName||'').trim() || profileUid;

  list.innerHTML = posts.map(post=>`
    <div class="card status-post" data-postid="${esc(post.id)}" style="margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        ${av}<b>${esc(displayName)}</b>${premiumBadge(profileUid)}
        <span class="small muted">· ${forumWhen(post.createdAt)}</span>
        ${(who && (who.userId===post.owner || isAdminMember(who.userId))) ? `<span class="small" data-delstatus="${esc(post.id)}" style="cursor:pointer;color:var(--bad);margin-left:auto;">delete</span>` : ''}
      </div>
      <div style="line-height:1.5;">${forumFormat(post.text)}</div>
      ${who ? reactionBar(post.reactions, who) : ''}
      <div class="small" data-togglereplies="${esc(post.id)}" style="cursor:pointer;color:var(--accent,#c9a84c);margin-top:6px;">💬 replies</div>
      <div class="status-replies" data-repliesfor="${esc(post.id)}" style="display:none;margin-top:8px;"></div>
    </div>`).join("");

  list.querySelectorAll('[data-delstatus]').forEach(el=>el.onclick=async()=>{
    if(!confirm("Delete this status update?")) return;
    try{ await DB.remove('statusUpdates', el.dataset.delstatus); renderStatusUpdates(body, DB, profileUid, who, isSelf); }
    catch(e){ alert("Couldn't delete: "+((e&&e.message)||e)); }
  });

  list.querySelectorAll('.status-post').forEach(card=>{
    const postId = card.dataset.postid;
    const post = posts.find(p=>p.id===postId);
    card.querySelectorAll('[data-react]').forEach(btn=>btn.onclick=async()=>{
      btn.disabled=true;
      try{
        const updated = await toggleReaction(DB, 'statusUpdates', {threadId:postId, owner:post.owner, threadData:post}, post.reactions, btn.dataset.react, who);
        post.reactions = updated; renderStatusUpdates(body, DB, profileUid, who, isSelf);
      }catch(e){ btn.disabled=false; }
    });
  });

  list.querySelectorAll('[data-togglereplies]').forEach(el=>el.onclick=async()=>{
    const postId = el.dataset.togglereplies;
    const box = list.querySelector(`[data-repliesfor="${postId}"]`);
    const opening = box.style.display === 'none';
    box.style.display = opening ? 'block' : 'none';
    if(!opening || box.dataset.loaded) return;
    box.dataset.loaded = '1';

    let replies = [];
    try{ replies = (await DB.listSub('statusUpdates', postId, 'replies')).sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0)); }catch(e){}

    box.innerHTML = `
      ${replies.map(r=>`<div style="border-top:1px solid var(--line);padding:8px 0;">
        <b class="small">${esc(r.owner)}</b> <span class="small muted">${forumWhen(r.createdAt)}</span>
        <div style="font-size:.95em;">${forumFormat(r.text)}</div>
      </div>`).join("")}
      ${who ? `<div style="margin-top:8px;display:flex;gap:6px;">
        <input data-replyinput="${postId}" placeholder="Reply…" style="flex:1;" maxlength="1000" />
        <button data-replysend="${postId}">Reply</button>
      </div>` : ''}`;

    const sendBtn = box.querySelector(`[data-replysend="${postId}"]`);
    if(sendBtn) sendBtn.onclick = async ()=>{
      const inp = box.querySelector(`[data-replyinput="${postId}"]`);
      const text = (inp.value||"").trim();
      if(!text) return;
      sendBtn.disabled = true;
      try{
        await DB.addSub('statusUpdates', postId, 'replies', { owner: who.userId, text, createdAt: new Date().toISOString() });
        box.dataset.loaded = '';
        el.click(); el.click(); // collapse then re-expand to reload with the new reply
      }catch(e){ sendBtn.disabled = false; }
    };
  });
}

async function renderMembers(v){
  v.innerHTML = `<div class="card"><h2>Members</h2>
    <p class="small">Everyone in the community. Click a name to see their stable, riders and links.</p>
    <div id="mList">Loading…</div></div>`;
  const DB = await __waitForDB();
  if(!DB){ $("mList").innerHTML='<span class="muted">Database unavailable.</span>'; return; }
  const [profiles, horses, riders] = await Promise.all([
    DB.listAll('profiles'), DB.listAll('horses'), DB.listAll('riders')
  ]);
  if(!profiles.length){ $("mList").innerHTML='<span class="muted">No member profiles yet. Make yours in the Stable Manager → My Profile.</span>'; return; }

  const countBy = (arr,owner)=>arr.filter(x=>x.__owner===owner).length;
  $("mList").innerHTML = `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));">`
    + profiles.map(p=>{
        const uid=p.__owner||p.__id;
        const name=(p.displayName||'').trim()||uid;
        const av=p.avatar
          ? `<img src="${__esc(p.avatar)}" referrerpolicy="no-referrer" style="width:130px;height:130px;border-radius:8px;object-fit:cover;border:1px solid var(--accent);flex:0 0 auto;" />`
          : `<div style="width:130px;height:130px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:3em;background:var(--deep);flex:0 0 auto;">&#128100;</div>`;
        return `<a class="linkbox" href="${memberHref(uid)}" data-member="${__esc(uid)}" style="display:flex;gap:14px;align-items:center;">
          ${av}
          <span style="min-width:0;">
            <b>${__esc(name)}${premiumBadge(uid)}</b>
            <span class="small">${countBy(horses,uid)} horses · ${countBy(riders,uid)} riders</span>
            ${p.discord?`<span class="small muted">Discord: ${__esc(p.discord)}</span>`:''}
          </span></a>`;
      }).join("") + `</div>`;
  // Open profiles in-page rather than reloading — the href stays a real link so
  // it can still be copied, shared or middle-clicked.
  $("mList").querySelectorAll('[data-member]').forEach(function(a){
    a.onclick=function(ev){
      ev.preventDefault();
      __memberView.uid=a.dataset.member;
      history.pushState({player:a.dataset.member}, '', memberHref(a.dataset.member));
      render();
    };
  });
}

// A SAFE post formatter — now a thin wrapper around richFormat() (defined
// further down), which is the ONE markup engine shared by forum posts,
// private messages, and breed/community About text. Keeps chat-style line
// breaks (every \n becomes a <br>), and still understands old posts written
// with *italic* or [img]url[/img], since richFormat supports both alongside
// the newer **bold**, __underline__, [text](url), and ![alt](url).
function forumFormat(raw){ return richFormat(raw, {chat:true}); }


let __forumView = { mode:"boards", boardId:null, threadId:null };

async function getForumBoards(DB){
  try{
    const cfg = await DB.get('config','forum');
    if(cfg && Array.isArray(cfg.boards) && cfg.boards.length) return cfg.boards;
  }catch(e){}
  return DEFAULT_FORUM_BOARDS;
}

      <button id="fb_addBoard" class="ghost" style="margin-top:6px;">+ Add board</button>
      <div style="margin-top:8px;"><button id="fb_save">Save boards</button> <span id="fb_msg" class="small"></span></div>
    </div>`;

  // ---- friendly EVENT rows (labeled boxes, add/remove) ----
  const eventsState = (H.events||[]).map(e=>({title:e.title||"",when:e.when||"",desc:e.desc||"",link:e.link||""}));
  function drawEventRows(){
    const box=$("e_eventRows"); if(!box) return;
    if(!eventsState.length){ box.innerHTML=`<p class="small muted">No events yet. Click "Add event" to make one.</p>`; return; }
    box.innerHTML = eventsState.map((e,i)=>`
      <div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;">
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:8px;">
          <div><label class="small">Title</label><input data-ev="${i}" data-f="title" value="${esc(e.title)}" placeholder="Spring Art Jam" /></div>
          <div><label class="small">When</label><input data-ev="${i}" data-f="when" value="${esc(e.when)}" placeholder="March 2026" /></div>
        </div>
        <label class="small">Description</label><input data-ev="${i}" data-f="desc" value="${esc(e.desc)}" placeholder="A month-long prompt series" />
        <label class="small">Link (optional)</label><input data-ev="${i}" data-f="link" value="${esc(e.link)}" placeholder="https://…" />
        <button class="ghost" data-evdel="${i}" style="margin-top:6px;color:var(--bad);padding:4px 10px;">Remove</button>
      </div>`).join("");
    box.querySelectorAll('[data-ev]').forEach(inp=>inp.oninput=()=>{ eventsState[+inp.dataset.ev][inp.dataset.f]=inp.value; });
    box.querySelectorAll('[data-evdel]').forEach(b=>b.onclick=()=>{ eventsState.splice(+b.dataset.evdel,1); drawEventRows(); });
  }
  drawEventRows();
  if($("e_addEvent")) $("e_addEvent").onclick=()=>{ eventsState.push({title:"",when:"",desc:"",link:""}); drawEventRows(); };
  attachRichToolbar($("e_start"));
  attachRichToolbar($("e_affil"));

  // ---- friendly BOARD rows (labeled boxes, add/remove) ----
  const boardsState = boards.map(b=>({id:b.id||"",name:b.name||"",desc:b.desc||"",_existing:true}));
  const slugify=s=>String(s||"").toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,24);
  function drawBoardRows(){
    const box=$("fb_boardRows"); if(!box) return;
    box.innerHTML = boardsState.map((b,i)=>`
      <div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;">
        <div class="grid" style="grid-template-columns:2fr 1fr;gap:8px;">
          <div><label class="small">Board name</label><input data-bd="${i}" data-f="name" value="${esc(b.name)}" placeholder="Advertisements" /></div>
          <div><label class="small">id ${b._existing?'<span style="color:var(--bad)">(keep as-is)</span>':'<span class="muted">(auto)</span>'}</label><input data-bd="${i}" data-f="id" value="${esc(b.id)}" placeholder="ads" style="font-family:var(--equi-mono);" /></div>
        </div>
        <label class="small">Description</label><input data-bd="${i}" data-f="desc" value="${esc(b.desc)}" placeholder="What this board is for" />
        <button class="ghost" data-bddel="${i}" style="margin-top:6px;color:var(--bad);padding:4px 10px;">Remove</button>
      </div>`).join("");
    box.querySelectorAll('[data-bd]').forEach(inp=>inp.oninput=()=>{
      const b=boardsState[+inp.dataset.bd], f=inp.dataset.f;
      b[f]=inp.value;
      // auto-fill id from name for NEW boards only (never rewrite an existing id)
      if(f==="name" && !b._existing && !b._idTouched){ b.id=slugify(inp.value); const idInp=box.querySelector(`[data-bd="${inp.dataset.bd}"][data-f="id"]`); if(idInp) idInp.value=b.id; }
      if(f==="id"){ b._idTouched=true; b.id=slugify(inp.value); }
    });
    box.querySelectorAll('[data-bddel]').forEach(bt=>bt.onclick=()=>{ boardsState.splice(+bt.dataset.bddel,1); drawBoardRows(); });
  }
  drawBoardRows();
  if($("fb_addBoard")) $("fb_addBoard").onclick=()=>{ boardsState.push({id:"",name:"",desc:"",_existing:false}); drawBoardRows(); };

  // community content save
  $("e_save").onclick=async()=>{
    $("e_status").textContent='Saving…';
    const events=eventsState
      .map(e=>({title:(e.title||"").trim(),when:(e.when||"").trim(),desc:(e.desc||"").trim(),link:(e.link||"").trim()}))
      .filter(e=>e.title||e.when||e.desc||e.link);
    try{
      await DB.put('config','hub',who.userId,{ id:'hub',
        discord:$("e_discord").value.trim(), start:$("e_start").value.trim(),
        affiliate:$("e_affil").value.trim(), events,
        wbServer:$("e_wbs").value.trim(), wbChannel:$("e_wbc").value.trim() });
      $("e_status").textContent='Saved.';
    }catch(err){ $("e_status").textContent='Failed: '+(err.message||err); }
  };

  // forum boards save
  $("fb_save").onclick=async()=>{
    const parsed=[]; const seen=new Set();
    boardsState.forEach(b=>{
      const name=(b.name||"").trim();
      let id=slugify(b.id||name);
      if(!name||!id||seen.has(id)) return; seen.add(id);
      parsed.push({id, name, desc:(b.desc||"").trim()});
    });
    if(!parsed.length){ $("fb_msg").textContent="Add at least one board with a name."; return; }
    $("fb_msg").textContent="Saving…";
    try{ await DB.put('config','forum',who.userId,{id:"forum",boards:parsed}); $("fb_msg").textContent="Saved."; }
    catch(err){ $("fb_msg").textContent="Failed: "+(err.message||err); }
  };
}

async function renderForum(v){
  const who = __me();
  const DB = await __waitForDB();
  if(!DB){ v.innerHTML = `<div class="card"><div class="small">Database unavailable.</div></div>`; return; }
  const boards = await getForumBoards(DB);
  if(__forumView.mode==="showguides") return renderShowBoard(v);
  if(__forumView.mode==="thread") return renderForumThread(v, DB, who, boards);
  if(__forumView.mode==="board")  return renderForumBoard(v, DB, who, boards);
  return renderForumBoards(v, DB, who, boards);
}

// ---- board list ----
async function renderForumBoards(v, DB, who, boards){
  let threads=[]; try{ threads = await DB.listAll('forumThreads'); }catch(e){}
  const countByBoard = {}; const postsByBoard = {}; const lastThreadByBoard = {};
  threads.forEach(t=>{
    if(!t||!t.boardId) return;
    countByBoard[t.boardId]=(countByBoard[t.boardId]||0)+1;
    postsByBoard[t.boardId]=(postsByBoard[t.boardId]||0)+1+(Number(t.replyCount)||0);
    const when = t.lastReplyAt||t.updatedAt||t.createdAt||"";
    if(!lastThreadByBoard[t.boardId] || when>(lastThreadByBoard[t.boardId].when||"")) lastThreadByBoard[t.boardId]={t, when};
  });
  const admin = who && isAdminMember(who.userId);

  const lastPostHtml = (boardId)=>{
    const entry = lastThreadByBoard[boardId];
    if(!entry) return `<span class="pb-empty-lastpost">No threads yet</span>`;
    const t = entry.t;
    const whoId = t.lastReplyBy || t.owner;
    return `<div class="pb-lastpost">
      <span class="pb-avatar-fallback">🐴</span>
      <div class="pb-lp-info">
        <span class="pb-lp-title">${esc(t.title||'(untitled)')}</span>
        <span class="pb-lp-who">by ${esc(whoId||'?')}</span><br>
        <span>${forumWhen(entry.when)}</span>
      </div>
    </div>`;
  };

  v.innerHTML = `
    <div class="card">
      <h2>Forum</h2>
      <p class="small">A home for discussion, roleplay, ads, and trades — right here on the site, no Discord needed.
      ${who?'Pick a board to read or start a thread.':'<b>Sign in to post.</b> You can browse freely.'}</p>
    </div>
    ${admin ? `<p class="small muted">Manage boards from the <b>Admin</b> tab.</p>` : ``}

    <div class="pb-category">
      <div class="pb-category__head"><span>📋 Show Board</span></div>
      <div class="pb-row" data-showguides="1">
        <div class="pb-icon">📋</div>
        <div>
          <div class="pb-title">Show Guides</div>
          <div class="pb-desc">Post and browse show guides — lore, classes, rules, prizes, and the entry link.</div>
        </div>
        <div class="pb-stats"><span class="small">Structured listings</span></div>
        <div class="pb-lastpost"><span class="small muted">Linked to the Shows app</span></div>
      </div>
    </div>

    <div class="pb-category">
      <div class="pb-category__head"><span>🗨️ Community Boards</span></div>
      <div class="pb-colheads"><span></span><span>Board</span><span>Threads</span><span>Last Post</span></div>
      ${boards.map(b=>`
        <div class="pb-row" data-board="${esc(b.id)}">
          <div class="pb-icon">💬</div>
          <div>
            <div class="pb-title">${esc(b.name)}</div>
            <div class="pb-desc">${esc(b.desc||'')}</div>
          </div>
          <div class="pb-stats"><b>${countByBoard[b.id]||0}</b>thread${(countByBoard[b.id]||0)===1?'':'s'}<span>${postsByBoard[b.id]||0} post${(postsByBoard[b.id]||0)===1?'':'s'}</span></div>
          ${lastPostHtml(b.id)}
        </div>`).join("")}
    </div>`;

  v.querySelectorAll('[data-board]').forEach(el=>el.onclick=()=>{ __forumView={mode:"board",boardId:el.dataset.board,threadId:null}; renderForum(v); });
  const sg=v.querySelector('[data-showguides]'); if(sg) sg.onclick=()=>{ __forumView={mode:"showguides"}; renderForum(v); };
}

// ---- one board: its threads + new-thread composer ----
async function renderForumBoard(v, DB, who, boards){
