  let threads=[]; try{ threads = (await DB.listAll('forumThreads')).filter(t=>t&&t.boardId===board.id); }catch(e){}
  threads.sort((a,b)=>{
    if((b.pinned?1:0)!==(a.pinned?1:0)) return (b.pinned?1:0)-(a.pinned?1:0);
    return String(b.updatedAt||b.createdAt||"").localeCompare(String(a.updatedAt||a.createdAt||""));
  });
  const admin = who && isAdminMember(who.userId);

  const threadRow = (t)=>`
    <div class="pb-row${t.pinned?' pinned':''}" data-thread="${esc(t.id)}">
      <div class="pb-icon">${t.pinned?'📌':'📝'}</div>
      <div>
        <div class="pb-title">${t.pinned?'<span class="pb-pin-tag">PINNED</span>':''}${esc(t.title||'(untitled)')}</div>
        <div class="pb-meta">by ${esc(t.owner||'?')}${premiumBadge(t.owner)} · started ${forumWhen(t.createdAt)}</div>
      </div>
      <div class="pb-stats"><b>${t.replyCount||0}</b>repl${(t.replyCount||0)===1?'y':'ies'}</div>
      ${t.lastReplyAt ? `<div class="pb-lastpost">
        <span class="pb-avatar-fallback">🐴</span>
        <div class="pb-lp-info">
          <span class="pb-lp-who">${esc(t.lastReplyBy||'?')}</span><br>
          <span>${forumWhen(t.lastReplyAt)}</span>
        </div>
      </div>` : `<div class="pb-lastpost"><span class="pb-empty-lastpost">No replies yet</span></div>`}
    </div>`;

  const pinned = threads.filter(t=>t.pinned);
  const rest = threads.filter(t=>!t.pinned);

  v.innerHTML = `
    <div class="shop-crumb"><button class="ghost" id="f_back">← All boards</button></div>
    <div class="card">
      <h2>${esc(board.name)}</h2>
      <p class="small">${esc(board.desc||'')}</p>
    </div>
    ${who ? `<div class="card">
      <h3>Start a thread</h3>
      <label>Title</label><input id="ft_title" placeholder="Give your thread a title" />
      <label>Post</label>
      <textarea id="ft_body" rows="5" placeholder="Write your post…"></textarea>
      <p class="small muted" style="margin:4px 0;">Or use the buttons above the box. Pasted links auto-link.</p>
      <div style="margin-top:8px;"><button id="ft_post">Post thread</button> <span id="ft_msg" class="small"></span></div>
    </div>` : ``}
    ${pinned.length ? `<div class="pb-category">
      <div class="pb-category__head"><span>📌 Pinned</span></div>
      ${pinned.map(threadRow).join("")}
    </div>` : ``}
    <div class="pb-category">
      <div class="pb-category__head"><span>Threads</span></div>
      ${rest.length ? `<div class="pb-colheads"><span></span><span>Thread</span><span>Replies</span><span>Last Post</span></div>${rest.map(threadRow).join("")}`
        : `<p class="small muted" style="padding:14px 20px;margin:0;">${pinned.length?'No other threads yet.':'No threads yet.'} ${who?'Be the first to post.':'Sign in to start one.'}</p>`}
    </div>`;

  $("f_back").onclick=()=>{ __forumView={mode:"boards",boardId:null,threadId:null}; renderForum(v); };
  v.querySelectorAll('[data-thread]').forEach(el=>el.onclick=()=>{ __forumView={mode:"thread",boardId:board.id,threadId:el.dataset.thread}; renderForum(v); });
  attachRichToolbar($("ft_body"));
  if($("ft_post")) $("ft_post").onclick=async()=>{
    const title=($("ft_title").value||"").trim();
    const body=($("ft_body").value||"").trim();
    if(!title){ $("ft_msg").textContent="Give it a title."; return; }
    if(!body){ $("ft_msg").textContent="Write something."; return; }
    const id="th_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const now=new Date().toISOString();
    const rec={ id, boardId:board.id, owner:who.userId, title, body, createdAt:now, updatedAt:now, pinned:false, replyCount:0 };
    $("ft_msg").textContent="Posting…";
    try{ await DB.put('forumThreads', id, who.userId, rec); __forumView={mode:"thread",boardId:board.id,threadId:id}; renderForum(v); }
    catch(err){ $("ft_msg").textContent="Failed: "+(err.message||err); }
  };
}

// ---- one thread: original post + replies + reply composer ----
// Parses @username mentions out of a post body. Matches word-characters,
// hyphens and underscores (covers every username style seen on this site).
function extractMentions(text){
  const found = new Set();
  const re = /@([A-Za-z0-9_-]{2,24})/g;
  let m; while((m = re.exec(text||""))) found.add(m[1]);
  return [...found];
}

function reactionBar(reactions, who, onClick){
  const EMOJIS = ['👍','❤️','😂','🎉','😮'];
  reactions = reactions || {};
  return `<div class="small" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
    ${EMOJIS.map(e=>{
      const list = reactions[e]||[];
      const mine = who && list.includes(who.userId);
      return `<button class="ghost react-btn${mine?' active':''}" data-react="${e}" style="padding:2px 8px;font-size:.95em;${mine?'border-color:var(--accent,#c9a84c);':''}">${e}${list.length?` ${list.length}`:''}</button>`;
    }).join("")}
  </div>`;
}

async function toggleReaction(DB, collection, path, current, emoji, who){
  const reactions = { ...(current||{}) };
  const list = new Set(reactions[emoji]||[]);
  if(list.has(who.userId)) list.delete(who.userId); else list.add(who.userId);
  reactions[emoji] = [...list];
  if(reactions[emoji].length===0) delete reactions[emoji];
  if(path.replyId){
    await DB.updateSub(collection, path.threadId, 'replies', path.replyId, { reactions });
  } else {
    await DB.put(collection, path.threadId, path.owner, { ...path.threadData, reactions });
  }
  return reactions;
}

async function renderForumThread(v, DB, who, boards){
  let t=null; try{ t = await DB.get('forumThreads', __forumView.threadId); }catch(e){}
  if(!t){ __forumView={mode:"board",boardId:__forumView.boardId,threadId:null}; return renderForum(v); }
  const board = boards.find(b=>b.id===t.boardId) || {name:"Board",id:t.boardId};
  const admin = who && isAdminMember(who.userId);

  let replies = [];
  try{ replies = (await DB.listSub('forumThreads', t.id, 'replies')).sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0)); }catch(e){}

  // Pull avatar/frame/badge for every author appearing in this thread, one
  // batch of lookups instead of one per post.
  const authorIds = [...new Set([t.owner, ...replies.map(r=>r.owner)])];
  const authorProfiles = {};
  await Promise.all(authorIds.map(async uid=>{
    try{ authorProfiles[uid] = await DB.get('profiles', uid); }catch(e){}
  }));
  const authorSide = (uid)=>{
    const p = authorProfiles[uid] || {};
    const av = p.avatar ? framedImg(p.avatar, p.frame, 84, uid) : `<div style="width:84px;height:84px;border-radius:12px;background:var(--deep);display:flex;align-items:center;justify-content:center;font-size:2.2em;">🐴</div>`;
    return `<div class="pb-post__side">
      ${av}
      <a href="index.html?player=${encodeURIComponent(uid)}" class="pb-post__name">${esc(p.displayName||uid)}</a>
      <div class="pb-post__badges">${premiumBadge(uid)}${adminBadge(uid)}</div>
    </div>`;
  };
  // Plain inline author line — used only in the edit-mode card, which keeps
  // its simpler single-column layout since it's a temporary editing state.
  const authorLine = (uid)=>{
    const p = authorProfiles[uid] || {};
    const av = p.avatar ? framedImg(p.avatar, p.frame, 40, uid) : `<div style="width:40px;height:40px;border-radius:8px;background:var(--panel,#1a1410);display:flex;align-items:center;justify-content:center;flex:0 0 auto;">🐴</div>`;
    return `<div style="display:flex;align-items:center;gap:8px;">
      ${av}
      <div>
        <a href="index.html?player=${encodeURIComponent(uid)}" style="font-weight:600;">${esc(p.displayName||uid)}</a>${premiumBadge(uid)}${adminBadge(uid)}
      </div>
    </div>`;
  };

  const editing = __forumView.editing; // "OP", or a reply id, or undefined

  const postBlock = (uid, when, bodyRaw, which, canDelete, canEdit, editedAt, reactions, path)=>{
    if(editing===which){
      return `<div style="border:1px solid var(--accent,#c9a84c);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:var(--panel,#140e07);">
        ${authorLine(uid)}
        <div class="small muted" style="margin:4px 0 6px;">editing</div>
        <textarea id="fe_body_${which}" rows="5">${esc(bodyRaw||'')}</textarea>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
          <button data-fesave="${which}">Save</button>
          <button class="ghost" data-fecancel="${which}">Cancel</button>
          <span class="small" id="fe_msg_${which}"></span>
        </div>
      </div>`;
    }
    const extra = (canEdit?` · <a href="#" data-editpost="${which}">edit</a>`:'')
                + (canDelete?` · <a href="#" data-delpost="${which}" style="color:var(--bad);">delete</a>`:'');
    return `
    <div class="pb-post">
      ${authorSide(uid)}
      <div class="pb-post__body">
        <div class="pb-post__meta"><span>${forumWhen(when)}${editedAt?` · edited ${forumWhen(editedAt)}`:''}</span><span>${extra}</span></div>
        <div style="line-height:1.6;">${forumFormat(bodyRaw)}</div>
        ${who ? reactionBar(reactions, who) : ''}
      </div>
    </div>`;
  };

  v.innerHTML = `
    <div class="shop-crumb">
      <button class="ghost" id="f_back">← ${esc(board.name)}</button>
      <button class="ghost" id="f_home">All boards</button>
    </div>
    <div class="card">
      <h2 style="word-break:break-word;">${t.pinned?'<span class="pb-pin-tag">PINNED</span> ':''}${esc(t.title||'(untitled)')}</h2>
      <div class="small muted">in <a href="#" id="f_boardlink">${esc(board.name)}</a></div>
      ${admin?`<div style="margin:10px 0 0;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="ghost" id="f_pin">${t.pinned?'Unpin':'📌 Pin'}</button>
        <button class="ghost" id="f_delthread" style="color:var(--bad);">Delete thread</button>
      </div>`:``}
    </div>
    ${postBlock(t.owner, t.createdAt, t.body, "OP", admin||(who&&who.userId===t.owner), who&&who.userId===t.owner, t.bodyEditedAt, t.reactions, {threadId:t.id, owner:t.owner, threadData:t})}
    ${replies.map(r=>postBlock(r.owner, r.createdAt, r.text, r.id, (admin||(who&&who.userId===r.owner)), who&&who.userId===r.owner, r.editedAt, r.reactions, {threadId:t.id, replyId:r.id})).join("")}
    ${who ? `<div class="card">
      <h3>Reply</h3>
      <textarea id="fr_body" rows="4" placeholder="Write a reply… (use @username to mention someone)"></textarea>
      <div style="margin-top:8px;"><button id="fr_post">Post reply</button> <span id="fr_msg" class="small"></span></div>
    </div>` : `<div class="card"><span class="small muted">Sign in to reply.</span></div>`}`;

  $("f_back").onclick=()=>{ __forumView={mode:"board",boardId:t.boardId,threadId:null}; renderForum(v); };
  $("f_home").onclick=()=>{ __forumView={mode:"boards",boardId:null,threadId:null}; renderForum(v); };
  if($("f_boardlink")) $("f_boardlink").onclick=(ev)=>{ ev.preventDefault(); __forumView={mode:"board",boardId:t.boardId,threadId:null}; renderForum(v); };

  attachRichToolbar($("fr_body"));
  v.querySelectorAll('[id^="fe_body_"]').forEach(ta=>attachRichToolbar(ta));
  v.querySelectorAll('[data-editpost]').forEach(a=>a.onclick=(ev)=>{ ev.preventDefault(); __forumView.editing=a.dataset.editpost; renderForum(v); });
  v.querySelectorAll('[data-fecancel]').forEach(b=>b.onclick=()=>{ __forumView.editing=null; renderForum(v); });

  v.querySelectorAll('[data-fesave]').forEach(b=>b.onclick=async()=>{
    const which=b.dataset.fesave;
    const ta=$("fe_body_"+which);
    const newBody=(ta.value||"").trim();
    const msgEl=$("fe_msg_"+which);
    if(!newBody){ if(msgEl) msgEl.textContent="Can't save an empty post."; return; }
    const now=new Date().toISOString();
    b.disabled=true; if(msgEl) msgEl.textContent="Saving…";
    try{
      if(which==="OP"){
        await DB.put('forumThreads', t.id, t.owner, { ...t, body:newBody, updatedAt:now, bodyEditedAt:now });
      } else {
        await DB.updateSub('forumThreads', t.id, 'replies', which, { text:newBody, editedAt:now });
      }
      __forumView.editing=null; renderForum(v);
    }catch(err){ if(msgEl) msgEl.textContent="Failed: "+(err.message||err); b.disabled=false; }
  });

  if($("fr_post")) $("fr_post").onclick=async()=>{
    const body=($("fr_body").value||"").trim();
    if(!body){ $("fr_msg").textContent="Write something."; return; }
    $("fr_msg").textContent="Posting…";
    try{
      // Real reply doc in the subcollection now — this is the actual fix
      // for replies to someone ELSE's thread failing to save at all.
      await DB.addSub('forumThreads', t.id, 'replies', {
        owner: who.userId, text: body, createdAt: new Date().toISOString()
      });
      // Bump thread metadata (allowed for any signed-in user under the
      // reaction/meta-only rule) so the board list shows accurate activity.
      try{
        await DB.put('forumThreads', t.id, t.owner, {
          ...t, replyCount: (replies.length+1), lastReplyAt: new Date().toISOString(), lastReplyBy: who.userId
        });
      }catch(e){ /* meta bump is best-effort, not critical if it fails */ }

      // @mentions -> notify (best-effort; a failed notify shouldn't block the reply)
      const token = await idToken();
      for(const uname of extractMentions(body)){
        try{ await railwayCall('/notifyMention', { idToken: token, body:{ toUserId: uname, threadId: t.id, threadTitle: t.title, boardId: t.boardId } }); }catch(e){}
      }
      renderForum(v);
    }catch(err){ $("fr_msg").textContent="Failed: "+(err.message||err); }
  };

  if($("f_pin")) $("f_pin").onclick=async()=>{ try{ await DB.put('forumThreads', t.id, t.owner, {...t, pinned:!t.pinned}); renderForum(v);}catch(e){} };
  if($("f_delthread")) $("f_delthread").onclick=async()=>{
    if(!confirm("Delete this whole thread? This can't be undone.")) return;
    try{ await DB.remove('forumThreads', t.id); __forumView={mode:"board",boardId:t.boardId,threadId:null}; renderForum(v);}catch(e){}
  };
  v.querySelectorAll('[data-delpost]').forEach(a=>a.onclick=async(ev)=>{
    ev.preventDefault();
    const which=a.dataset.delpost;
    if(which==="OP"){
      if(!confirm("Delete the original post? This deletes the whole thread.")) return;
      try{ await DB.remove('forumThreads', t.id); __forumView={mode:"board",boardId:t.boardId,threadId:null}; renderForum(v);}catch(e){}
    } else {
      if(!confirm("Delete this reply?")) return;
      try{ await DB.deleteSub('forumThreads', t.id, 'replies', which); renderForum(v);}catch(e){}
    }
  });

  // Reaction buttons — every post, OP included.
  v.querySelectorAll('.forum-post').forEach((card, idx)=>{
    if(!who) return;
    const isOP = idx===0;
    const path = isOP ? {threadId:t.id, owner:t.owner, threadData:t} : {threadId:t.id, replyId: replies[idx-1] && replies[idx-1].id};
    const currentReactions = isOP ? t.reactions : (replies[idx-1] && replies[idx-1].reactions);
    card.querySelectorAll('[data-react]').forEach(btn=>btn.onclick=async()=>{
      btn.disabled=true;
      try{
        const updated = await toggleReaction(DB, 'forumThreads', path, currentReactions, btn.dataset.react, who);
        if(isOP) t.reactions = updated; else replies[idx-1].reactions = updated;
        renderForum(v);
      }catch(e){ btn.disabled=false; }
    });
  });
}

function forumWhen(iso){
  if(!iso) return "";
  const d=new Date(iso); if(isNaN(d)) return "";
  const now=Date.now(), diff=now-d.getTime();
  const day=86400000;
  if(diff<60000) return "just now";
  if(diff<3600000) return Math.floor(diff/60000)+"m ago";
  if(diff<day) return Math.floor(diff/3600000)+"h ago";
  if(diff<7*day) return Math.floor(diff/day)+"d ago";
  return d.toLocaleDateString();
}

// ═══════════════════════════════════════════════════════════════════════════
//  UNIFIED RICH TEXT — one markup language, one renderer, used everywhere
//  long-form text is written: breed About/Import text, forum posts & replies,
//  show guides, and private messages. Members type plain text; everything is
//  escaped FIRST, then a small safe subset is re-enabled below. No raw HTML
//  is ever rendered, so there's no script-injection surface.
//
//    **bold**              __underline__          ## Heading   (own line)
//    - bullet  (own line)  [link text](url)        ![alt](url) image
//
//  A lone image on its own line (blank line above/below) renders full-width —
//  that's the DA-journal-style divider between paragraphs. Anywhere else in a
//  line, ![]() is left as plain escaped text rather than a small inline image,
//  to keep posts from getting visually noisy — use the toolbar's Image button
//  and it'll place it correctly either way. Legacy content keeps working:
//  *italic*, [img]url[/img], and bare pasted links all still render.
// ═══════════════════════════════════════════════════════════════════════════
const __RICH_TOKEN = /!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)|\[img\]\s*(https?:\/\/[^\s\]]+?)\s*\[\/img\]|\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|\*\*([^*]+)\*\*|__([^_]+)__|\*([^*\n]+)\*|(https?:\/\/[^\s<>()\]]+)/g;
function __mdImgTag(url, alt){
  return `<img src="${__esc(url)}" alt="${__esc(alt||'')}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display='none'" style="max-width:100%;border-radius:8px;margin:8px 0;display:block;">`;
}
// Renders one line/segment of raw text — bold, underline, links, and bare
// image syntax all inline. Every character not matched by a token is escaped.
function __richInline(raw){
  const s = String(raw||"");
  __RICH_TOKEN.lastIndex = 0;
  let out='', last=0, m;
  while((m = __RICH_TOKEN.exec(s))){
    out += __esc(s.slice(last, m.index));
    if(m[1]!==undefined || m[3]!==undefined) out += __mdImgTag(m[2]!==undefined?m[2]:m[3], m[1]);
    else if(m[4]!==undefined) out += `<a href="${__esc(m[5])}" target="_blank" rel="noopener noreferrer">${__esc(m[4])}</a>`;
    else if(m[6]!==undefined) out += `<b>${__esc(m[6])}</b>`;
    else if(m[7]!==undefined) out += `<u>${__esc(m[7])}</u>`;
    else if(m[8]!==undefined) out += `<i>${__esc(m[8])}</i>`;
    else if(m[9]!==undefined) out += `<a href="${__esc(m[9])}" target="_blank" rel="noopener noreferrer">${__esc(m[9])}</a>`;
    last = __RICH_TOKEN.lastIndex;
  }
  out += __esc(s.slice(last));
  return out;
}
// opts.chat=true (forum/messages): every single \n becomes a <br> — casual,
// chat-style spacing. opts.chat=false (About/community text, the default for
// mdish below): single line breaks inside a paragraph are soft-wrapped like
// normal markdown, only a blank line starts a new paragraph.
function richFormat(t, opts){
  if(!t) return "";
  const chat = !!(opts && opts.chat);
  return String(t).split(/\n{2,}/).map(block=>{
    const lines = block.split('\n');
    // A block that's ONLY an image renders full-width with no <p> wrapper.
    if(lines.length===1 && (/^!\[[^\]]*\]\(https?:\/\/[^\s)]+\)$/.test(lines[0].trim()) || /^\[img\]\s*https?:\/\/\S+\s*\[\/img\]$/i.test(lines[0].trim())))
      return __richInline(lines[0].trim());
    if(lines.every(l=>l.trim().startsWith('- ')))
      return `<ul>${lines.map(l=>`<li>${__richInline(l.trim().slice(2))}</li>`).join('')}</ul>`;
    if(lines[0].startsWith('## '))
      return `<h4 style="color:var(--accent2);margin:12px 0 4px;">${__esc(lines[0].slice(3))}</h4>`
        + (lines.slice(1).length?`<p>${lines.slice(1).map(__richInline).join(chat?'<br>':' ')}</p>`:'');
    return `<p>${lines.map(__richInline).join(chat?'<br>':' ')}</p>`;
  }).join('');
}
function mdish(t){ return richFormat(t, {chat:false}); }

// Attaches an old-school forum-editor toolbar (Bold/Underline/Heading/Bullet/
// Link/Image) to a textarea, wired to the exact markup richFormat() renders
// above — select text and click a button, same as any BBCode editor. Also
// keeps Ctrl/Cmd+B, +U, +I as shortcuts. Safe to call on any textarea that
// gets displayed through richFormat/mdish/forumFormat.
function attachRichToolbar(ta){
  if(!ta || ta.__richToolbar) return;
  ta.__richToolbar = true;

  function apply(before, after, placeholder){
    const s=ta.selectionStart, en=ta.selectionEnd, val=ta.value;
    const sel = val.slice(s,en) || placeholder;
    ta.value = val.slice(0,s) + before + sel + after + val.slice(en);
    ta.selectionStart = s + before.length;
    ta.selectionEnd = s + before.length + sel.length;
    ta.dispatchEvent(new Event('input'));
  }
  function applyLines(prefix){
    const s=ta.selectionStart, en=ta.selectionEnd, val=ta.value;
    const lineStart = val.lastIndexOf('\n', s-1)+1;
    let lineEnd = val.indexOf('\n', en); if(lineEnd===-1) lineEnd = val.length;
    const lines = val.slice(lineStart, lineEnd).split('\n');
    const allPrefixed = lines.every(l=>!l.trim() || l.startsWith(prefix));
    const changed = lines.map(l=>{
      if(!l.trim()) return l;
      return allPrefixed ? l.slice(prefix.length) : (l.startsWith(prefix)?l:prefix+l);
    }).join('\n');
    ta.value = val.slice(0,lineStart) + changed + val.slice(lineEnd);
    ta.selectionStart = lineStart; ta.selectionEnd = lineStart + changed.length;
    ta.dispatchEvent(new Event('input'));
  }
  function insertBlock(text){
    const s=ta.selectionStart, val=ta.value;
    const before = val.slice(0,s), after = val.slice(s);
    const pre = before.length ? '\n\n' : '';
    const post = after.length ? '\n\n' : '';
    ta.value = before + pre + text + post + after;
    const pos = before.length + pre.length;
    ta.selectionStart = pos; ta.selectionEnd = pos + text.length;
    ta.dispatchEvent(new Event('input'));
  }

  const bar = document.createElement('div');
  bar.style.cssText = 'display:flex;gap:4px;flex-wrap:wrap;margin:4px 0;';
  const mkBtn = (label, title, fn) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ghost'; b.title = title;
    b.textContent = label;
    b.style.cssText = 'padding:3px 10px;font-size:.85em;line-height:1.4;';
    b.onclick = (e)=>{ e.preventDefault(); fn(); ta.focus(); };
    return b;
  };
  bar.appendChild(mkBtn('B', 'Bold (Ctrl/Cmd+B)', ()=>apply('**','**','bold text')));
  const uBtn = mkBtn('U', 'Underline (Ctrl/Cmd+U)', ()=>apply('__','__','underlined text'));
  uBtn.style.textDecoration = 'underline';
  bar.appendChild(uBtn);
  bar.appendChild(mkBtn('H', 'Heading (own line)', ()=>insertBlock('## Heading')));
  bar.appendChild(mkBtn('•—', 'Bullet list', ()=>applyLines('- ')));
  bar.appendChild(mkBtn('🔗', 'Link', ()=>{
    const url = prompt('Link URL (https://…)'); if(!url) return;
    apply('[', `](${url.trim()})`, 'link text');
  }));
  bar.appendChild(mkBtn('🖼', 'Embed image (own line = full width)', ()=>{
    const url = prompt('Image URL (https://…)'); if(!url) return;
    insertBlock(`![](${url.trim()})`);
  }));
  ta.parentNode.insertBefore(bar, ta);

  ta.addEventListener('keydown', e=>{
    if(!(e.ctrlKey||e.metaKey)) return;
    const k=e.key.toLowerCase();
    if(k==='b'){ e.preventDefault(); apply('**','**','bold text'); }
    else if(k==='u'){ e.preventDefault(); apply('__','__','underlined text'); }
    else if(k==='i'){ e.preventDefault(); apply('*','*','italic text'); }
  });
}

      return `<div style="border:1px solid var(--line);border-radius:8px;margin-bottom:14px;background:var(--deep);overflow:hidden;${closed?'opacity:.6;':''}">

          <div style="margin-top:8px;">${richFormat(teaser, {chat:true})}</div>
          ${long?`<details style="margin-top:6px;"><summary style="cursor:pointer;color:var(--accent);">Read the full guide</summary>
            <div style="margin-top:8px;">${richFormat(body, {chat:true})}</div></details>`:''}
          ${g.link?`<div style="margin-top:10px;"><a href="${esc(g.link)}" target="_blank" rel="noopener"
            style="display:inline-block;background:var(--accent);color:#241a14;font-weight:bold;padding:8px 16px;border-radius:6px;text-decoration:none;">Enter this show →</a></div>`:''}

            </div>`:''}

// ============================================================
//  MESSAGES — member-to-member private notes.
//
//  A message is ONE document in `messages`, written by the sender:
//    owner = sender's userId   (so the sender can list what they sent)
//    to    = recipient, hoisted OUTSIDE the json blob so a security rule and a
//            query can both see it (Firestore can't read inside the blob)
//
//  Privacy is enforced by the RULES, not by this file. Because the hub upgrades
//  its session to a token whose uid IS the bank userId (see upgradeToOwnerSession),
//  a rule can compare request.auth.uid against owner/to and genuinely restrict
//  reads to the two people involved. Without those rules published this tab
//  fails CLOSED — reads are refused — rather than exposing anyone's mail.
//  See the MESSAGES_RULES note below for the exact rule to publish.
// ============================================================
let __msgCache = { inbox:[], sent:[], loadedAt:0, loading:false };

// ---- show results, in the inbox ----------------------------------------
// Placements waiting to be recorded on a horse. Built the same way the tracker
// builds it: read our own `entered` receipts, fetch each show by id, find our
// row in the published results.
//
// The CLAIM itself is handed to the tracker rather than done here. Adding a
// show to a horse appends to compHistory and artLog, awards EXP and re-runs the
// level check — that model lives in the tracker, and a second copy of it here
// would drift out of step the first time either side changed. So the button
// opens the tracker with the claim already identified and it finishes the job.
let __resultsCache = { items:[], loadedAt:0, loading:false };

async function loadHubResults(force){
  const who=me(); if(!who) return __resultsCache;
  if(__resultsCache.loading) return __resultsCache;
  if(!force && __resultsCache.loadedAt && Date.now()-__resultsCache.loadedAt<45000) return __resultsCache;
  const DB=await __waitForDB(); if(!DB || !DB.listByOwner) return __resultsCache;
  __resultsCache.loading=true;
  try{
    const receipts = await DB.listByOwner('entered', who.userId) || [];
    const docs = await Promise.all(receipts.map(async rc=>{
      try{ return {rc, doc: await DB.get('shows', rc.showId)}; }catch(e){ return {rc, doc:null}; }
    }));
    const items=[];
    for(const {rc, doc} of docs){
      if(!doc) continue;
      const sh = doc.show || {};
      const results = (doc.published && doc.published.results) || null;
      if(!results){
        items.push({ pending:true, showId:rc.showId, horseId:rc.horseId,
                     horseName:rc.horseName||'', title: sh.title || rc.showTitle || 'A show' });
        continue;
      }
      const row = results.find(r=>r.id===rc.horseId);
      if(!row) continue;
      items.push({ pending:false, showId:rc.showId, horseId:rc.horseId,
        horseName: rc.horseName || row.name || '',
        title: sh.title || rc.showTitle || 'A show',
        placement: row.placement>=1 ? row.placement : null,
        hasArt: !!row.artUrl });
    }
    items.sort((a,b)=> String(b.showId).localeCompare(String(a.showId)));
    __resultsCache.items=items; __resultsCache.loadedAt=Date.now();
  }catch(e){ console.warn('[Hub] results load failed:', e && e.message); }
  finally{ __resultsCache.loading=false; }
  return __resultsCache;
}
function resultsWaiting(){ return __resultsCache.items.filter(i=>!i.pending).length; }

function renderResultsInbox(host){
  const items=__resultsCache.items;
  if(!items.length){
    host.innerHTML='<div class="small muted">No show results yet. Shows you enter appear here once the host publishes.</div>';
    return;
  }
  host.innerHTML = items.map(it=>{
    const who = esc(it.horseName || 'your horse');
    if(it.pending){
      return `<div style="padding:6px 0;border-top:1px solid var(--line);">
        <b>${esc(it.title)}</b> <span class="small muted">· ${who} · results not posted yet</span></div>`;
    }
    const place = it.placement ? (["1st","2nd","3rd","4th","5th","6th"][it.placement-1]||it.placement+"th") : "Participant";
    const href = `${APPS.stable}?claim=${encodeURIComponent(it.showId)}&h=${encodeURIComponent(it.horseId)}`;
    return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line);">
      <span style="flex:1;min-width:180px;"><b>${esc(it.title)}</b>
        <span class="small muted">· ${esc(place)} · ${who}${it.hasArt?' · art attached':''}</span></span>
      <a class="btn" href="${href}" style="text-decoration:none;padding:3px 12px;">Add to horse</a>
    </div>`;
  }).join("");
}

let __msgView = { mode:"inbox", to:"", replyTo:null };

function msgId(){ return 'm_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

// People I've blocked — kept on my own profile, so it travels with my account.
function myBlocked(){
  const p = window.__myProfile || {};
  return Array.isArray(p.blocked) ? p.blocked.map(String) : [];
}
async function setBlocked(list){
  const who=me(); if(!who) return false;
  const DB=await waitForDB(); if(!DB) return false;
  const prof = (await DB.get('profiles', who.userId)) || {};
  prof.blocked = list;
  window.__myProfile = prof;
  return await DB.put('profiles', who.userId, who.userId, prof);
}

async function loadMessages(force){
  const who=me(); if(!who) return __msgCache;
  if(__msgCache.loading) return __msgCache;
  if(!force && __msgCache.loadedAt && Date.now()-__msgCache.loadedAt<45000) return __msgCache;
  const DB=await waitForDB(); if(!DB || !DB.listByField) return __msgCache;
  __msgCache.loading=true;
  try{
    const [inbox, sent, prof] = await Promise.all([
      DB.listByField('messages','to',who.userId),
      DB.listByOwner('messages', who.userId),
      DB.get('profiles', who.userId).catch(()=>null),
    ]);
    if(prof) window.__myProfile = prof;
    const blocked = myBlocked();
    const bySent = (a,b)=> String(b.sentAt||"").localeCompare(String(a.sentAt||""));
    __msgCache.inbox = (inbox||[]).filter(m=>!blocked.includes(String(m.from))).sort(bySent);
    __msgCache.sent  = (sent||[]).sort(bySent);
    __msgCache.loadedAt = Date.now();
    __msgCache.error = null;
  }catch(e){
    const t=String((e&&e.message)||e);
    __msgCache.error = /permission|insufficient/i.test(t)
      ? "The database refused to read messages. The <b>messages</b> rules haven't been published yet — until they are, no one can send or read mail."
      : "Couldn't load messages: "+esc(t);
  }finally{ __msgCache.loading=false; }
  return __msgCache;
}
function msgUnread(){ return __msgCache.inbox.filter(m=>!m.read).length; }

async function sendMessage(toId, subject, body){
  const who=me(); if(!who) return {ok:false, msg:"Sign in first."};
  if(!toId) return {ok:false, msg:"Pick who you're writing to."};
  if(String(toId)===String(who.userId)) return {ok:false, msg:"That's your own account."};
  if(!body.trim()) return {ok:false, msg:"Write something first."};
  const DB=await waitForDB(); if(!DB || !DB.putWithField) return {ok:false, msg:"Database unavailable."};
  const id=msgId();
  const rec={ id, from:who.userId, to:String(toId), subject:(subject||"").trim().slice(0,120),
              body:body.trim().slice(0,4000), sentAt:new Date().toISOString(), read:false };
  try{
    await DB.putWithField('messages', id, who.userId, rec, 'to', String(toId));
    __msgCache.loadedAt=0;
    return {ok:true, msg:"Sent to "+esc(toId)+"."};
  }catch(e){
    const t=String((e&&e.message)||e);
    return {ok:false, msg: /permission|insufficient/i.test(t)
      ? "The database refused to send. The messages rules haven't been published yet."
      : "Couldn't send: "+esc(t) };
  }
}
async function markMessageRead(m){
  const who=me(); if(!who || m.read) return;
  const DB=await waitForDB(); if(!DB) return;
  m.read=true;
  try{ await DB.putWithField('messages', m.id, m.from, m, 'to', m.to); }
  catch(e){ /* recipient may not be allowed to update; harmless either way */ }
}
async function deleteMessage(m){
  const DB=await waitForDB(); if(!DB) return false;
  try{ await DB.remove('messages', m.id); __msgCache.loadedAt=0; return true; }
  catch(e){ return false; }
}

function renderMessages(v){

    v.innerHTML=`
      <div class="card">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <b style="color:var(--accent);">Show results</b>
          <span class="small muted">Placements waiting to go on a horse.</span>
          <span style="flex:1;"></span>
          <button class="ghost" id="res_reload" style="padding:2px 9px;font-size:.85em;">Refresh</button>
        </div>

      </div>

      <div class="card">
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
          <button class="ghost" data-mtab="inbox" style="${mode==='inbox'?'font-weight:bold;':''}">Inbox${msgUnread()?' ('+msgUnread()+')':''}</button>

        </div>
        ${__msgCache.error?`<div class="small" style="color:var(--equi-rust);margin-top:8px;">${__msgCache.error}</div>`:''}
      </div>

      ${mode==='compose' ? `
      <div class="card">
        <h3 style="margin-top:0;">New message</h3>
        <label>To</label>
        <input id="m_to" list="m_members" value="${esc(__msgView.to||'')}" placeholder="member username" />
        <datalist id="m_members">${names.map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist>
        <label style="margin-top:8px;display:block;">Subject <span class="small muted">(optional)</span></label>
        <input id="m_subj" value="${esc(__msgView.replySubject||'')}" placeholder="What's this about?" />
        <label style="margin-top:8px;display:block;">Message</label>
        <textarea id="m_body" style="min-height:130px;width:100%;" placeholder="Write your message…">${esc(__msgView.replyBody||'')}</textarea>
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <button class="btn" id="m_send">Send</button>
          <span class="small" id="m_msg"></span>

      <div class="card">
        <b>Blocked members</b>
        <div class="small muted" style="margin:4px 0 8px;">Blocked members' messages won't appear in your inbox.</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
          <input id="m_block" list="m_members" placeholder="username to block" style="max-width:220px;" />
          <button class="ghost" id="m_blockadd">Block</button>
        </div>
        <div style="margin-top:8px;">${blocked.length?blocked.map(b=>`<span class="tag" style="margin-right:6px;">${esc(b)} <span data-munblock="${esc(b)}" style="cursor:pointer;color:var(--equi-rust);">✕</span></span>`).join(""):'<span class="small muted">No one blocked.</span>'}</div>
      </div>`;

    const resHost=v.querySelector('#res_list');
    if(resHost){
      renderResultsInbox(resHost);

      const newMode=b.dataset.mtab;
      if(newMode==='compose'){ __msgView={mode:'compose',to:'',replyTo:null,replySubject:'',replyBody:''}; }

    });

    attachRichToolbar(v.querySelector('#m_body'));
    if(sendBtn) sendBtn.onclick=async()=>{
      const out=v.querySelector('#m_msg');

                                v.querySelector('#m_subj').value,
                                v.querySelector('#m_body').value);
      sendBtn.disabled=false;
      out.innerHTML=r.msg;
      if(r.ok){ __msgView={mode:"sent",to:"",replyTo:null}; renderMessages(v); renderNav(); }
    };
    const blockAdd=v.querySelector('#m_blockadd');
    if(blockAdd) blockAdd.onclick=async()=>{
      const n=v.querySelector('#m_block').value.trim(); if(!n) return;
      const next=Array.from(new Set(myBlocked().concat([n])));

    };
    v.querySelectorAll('[data-munblock]').forEach(x=>x.onclick=async()=>{
      await setBlocked(myBlocked().filter(b=>b!==x.dataset.munblock));
      __msgCache.loadedAt=0; renderMessages(v);
    });

    // Opening the inbox marks what's on screen as read.
    if(mode==='inbox'){
      const unread=list.filter(m=>!m.read);
      if(unread.length){ Promise.all(unread.map(markMessageRead)).then(()=>renderNav()); }
    }
  });
}

        say("Sending…","muted");
        const r=await window.EquiAuth.resetPassword(email);
        go.disabled=false;
        say(r.success ? "Check your email for a reset link." : r.error, r.success?"good":"bad");
        return;
      }

      const email=$("g_email").value.trim(), pass=$("g_pass").value;
      if(!email||!pass){ say("Enter your email and password.","bad"); go.disabled=false; return; }
      say(mode==="signup"?"Creating your account…":"Signing in…","muted");
      const r = mode==="signup" ? await window.EquiAuth.signUp(email,pass) : await window.EquiAuth.signIn(email,pass);
      go.disabled=false;
      if(!r.success){ say(r.error,"bad"); return; }
      await afterAuth();
    };
    $("g_pass") && ($("g_pass").onkeydown=e=>{ if(e.key==="Enter") go.onclick(); });
  }

  if(mode==="link"){
    const linkBtn=$("g_link");
    linkBtn.onclick=async()=>{
      const userId=$("g_user").value.trim(), oldPass=$("g_oldpass").value;
      if(!userId||!oldPass){ say("Enter your old User ID and password.","bad"); return; }
      linkBtn.disabled=true; say("Linking…","muted");
      const token=await window.EquiAuth.token();
      const r=await railwayCall('/claimLegacyAccount', { idToken: token, body:{ legacyUserId:userId, legacyPassword:oldPass } });
      linkBtn.disabled=false;
      if(r?.success){
        localStorage.setItem("equi-lite-bank", JSON.stringify({userId:r.userId, password:"", linked:true}));
        await upgradeToOwnerSession();
        await ensureProfile(r.userId);
        say(`Linked! Welcome back, ${r.displayName}.`,"good");
        render();
      } else say(r?.error||"Could not link that account.","bad");
    };

    const newBtn=$("g_new");
    newBtn.onclick=async()=>{
      const userId=$("g_newid").value.trim();
      if(!userId){ say("Pick a User ID.","bad"); return; }
      newBtn.disabled=true; say("Creating your stable…","muted");
      const token=await window.EquiAuth.token();
      const r=await railwayCall('/registerBankAccount', { idToken: token, body:{ bankUserId:userId, displayName:userId } });
      newBtn.disabled=false;
      if(r?.success){
        localStorage.setItem("equi-lite-bank", JSON.stringify({userId:r.userId, password:"", linked:true}));
        await upgradeToOwnerSession();
        await ensureProfile(r.userId);
        say(`Welcome to EquiStories, ${r.displayName}!`,"good");
        render();
      } else say(r?.error||"Could not create that account.","bad");
    };
  }
}

// Same origin as the tracker and shows, so Firebase already knows us — adopt that
// session instead of demanding a second sign-in.
let __adopting=false;
async function adoptSharedSession(){
  if(__adopting) return; __adopting=true;
  try{
    if(!window.EquiAuth) return;
    await window.EquiAuth.ready;
    if(me() || !window.EquiAuth.user) return;
    const token=await window.EquiAuth.token(); if(!token) return;
    const who=await railwayCall('/getMyAccount', { idToken: token, body:{} });
    if(who?.success && who.linked){
      localStorage.setItem("equi-lite-bank", JSON.stringify({
        userId:who.userId, password:"", linked:true }));
      console.log('[Hub] adopted shared session:', who.userId);
      await upgradeToOwnerSession();
      await ensureProfile(who.userId);
      render();
    }
  }catch(e){ console.warn('[Hub] session adopt failed:', e); }
  finally{ __adopting=false; }
}

let __ownerUpgradeAttempted = false;
function render(){
  if(!me()){ renderGate(); adoptSharedSession(); return; }
  // Returning session (localStorage already says who you are) — but that
  // doesn't mean Firestore's auth.uid matches yet. adoptSharedSession() only
  // handles a FRESH session; a returning one needs this same upgrade
  // attempted once per page load too, or every read silently 404s/permission-
  // denies forever using a non-owner uid. Fire-and-forget + re-render once
  // resolved, so the first paint isn't blocked on it.
  if(!__ownerUpgradeAttempted){
    __ownerUpgradeAttempted = true;
    const who = me();
    if(window.EquiAuth && who && window.EquiAuth.uid !== who.userId){
      Promise.resolve(window.EquiAuth.ready).then(()=> upgradeToOwnerSession()).then(ok=>{
        if(ok) render(); // re-render now that reads will actually work
      });
    }
  }
  // A ?player= link from anywhere on the site opens that member's profile here.
  if(!__memberView.__booted){
    __memberView.__booted = true;
    try{
      var __pp = new URLSearchParams(location.search).get('player');
      if(__pp){ __memberView.uid = __pp; tab = "Members"; }
    }catch(e){}
  }
  renderNav();
  // Quietly check for new mail so the badge is right on every tab (cached ~45s).
  if(!__msgCache.loadedAt && !__msgCache.loading){
    loadHubResults();
    loadMessages().then(c=>{
      if(c && c.inbox && c.inbox.length) renderNav();
      if(window.EquiNav && window.EquiNav.setBadge) window.EquiNav.setBadge('hub', msgUnread()+resultsWaiting());
    });
  }
  const v=$("view");
  v.innerHTML = `<div class="card"><div class="small">Loading…</div></div>`;
  if(tab==="Home") renderHome(v);
  else if(tab==="Bank") renderBank(v);
  else if(tab==="Members"){ if(__memberView.uid) renderMemberProfile(v, __memberView.uid); else renderMembers(v); }
  else if(tab==="Community") renderCommunity(v);
  else if(tab==="Messages") renderMessages(v);
  else if(tab==="Forum") renderForum(v);
  else if(tab==="Admin"){ const w=me(); if(w && isAdminMember(w.userId)) location.href="admin.html"; else { tab="Home"; renderHome(v); } }
  else if(tab==="Shops") renderShops(v);
  else if(tab==="Breeds") renderBreeds(v);
  else renderForum(v);
}
// ============================================================
//  BREEDS — affiliated breed communities (Irish Lightblood & co.)
//  A breed reuses the bank (business), tokens (breed items), and the
//  tracker (an import IS a stamped horse). Nothing here is ILB-specific;
//  the ILB is just the first document in the `breeds` collection.
//    breeds/{id}        — profile, staff, business, theme
//    breedImports/{id}  — designs for sale (premade / custom slot)
//    breedOrders/{id}   — purchase/custom requests (owner = buyer)
//  Registry is DERIVED from tracked horses stamped with the breed name.
// ============================================================
const BREED_THEME_DEFAULTS = { accent:"#c9a8e8", panel:"#140e07", head:"#c9a84c" };
function breedThemeVars(t){
  t = t || {};
  return `--sf-accent:${t.accent||BREED_THEME_DEFAULTS.accent}; --sf-panel:${t.panel||BREED_THEME_DEFAULTS.panel}; --sf-head:${t.head||BREED_THEME_DEFAULTS.head};`;
}
function isBreedStaff(breed, who){
  if(!breed || !who) return false;
  return breed.owner===who.userId || (Array.isArray(breed.staff) && breed.staff.includes(who.userId));
}

let __breedView = { mode:"browse", breedId:null, tab:"about" };

async function renderBreeds(v){
  const who = me();
  const DB = await waitForDB();
  if(!DB){ v.innerHTML = `<div class="card"><div class="small">Database unavailable.</div></div>`; return; }
  if(__breedView.mode==="found"){ return renderBreedFound(v, DB, who); }
  if(__breedView.mode==="page"){  return renderBreedPage(v, DB, who, __breedView.breedId); }
  return renderBreedBrowse(v, DB, who);
}

async function breedOrderPremade(body, DB, who, breed, imports, importId){
  const imp = imports.find(i=>i.id===importId);
  if(!imp || !who) return;
  const horseName = prompt(`Order “${imp.name}” for ✦${Number(imp.price)||0}?\n\nName the horse as you'd like it registered (you can change it later):`, imp.name);
  if(horseName===null) return;

  if(window.EquiAuth && window.EquiAuth.uid !== who.userId){ await upgradeToOwnerSession(); }
  // Create the order (owner = buyer) and put the import on hold so it can't be double-sold.
  const orderId="order_"+Math.random().toString(36).slice(2,10);
  const order={ id:orderId, owner:who.userId, breedId:breed.id, importId:imp.id, kind:"premade",
    horseName:horseName.trim()||imp.name, price:Number(imp.price)||0, note:"",
    designUrl:imp.designUrl||"", image:imp.image||"",
    status:"submitted", submittedAt:new Date().toISOString() };
  try{
    await DB.putWithField('breedOrders', orderId, who.userId, order, 'breedId', order.breedId);
    // hold the import — best effort (only staff own the import doc; if this fails,
    // staff still see the order and can decline duplicates)
    try{ imp.status='pending'; imp.heldBy=who.userId; await DB.put('breedImports', imp.id, imp.owner||breed.owner, imp); }catch(e){}
    __breedView={mode:"page",breedId:breed.id,tab:"my orders"}; renderBreeds(document.getElementById('view'));
  }catch(err){ alert("Couldn't submit the order: "+(err.message||err)); }
}

  if(!who){ body.innerHTML=""; return; }
  let orders=[]; try{ orders = await DB.listByOwner('breedOrders', who.userId); }catch(e){}
  orders = orders.filter(o=>o.breedId===breed.id).sort((a,b)=>String(b.submittedAt||'').localeCompare(String(a.submittedAt||'')));

  // Approved orders the buyer still needs to CLAIM (creates the horse on their account).
  const toClaim = orders.filter(o=>o.status==='approved');
  body.innerHTML = `
    ${toClaim.length ? `<div class="card"><h3>Ready to add to your tracker</h3>
      <p class="small">These imports were approved. Claiming one creates the horse on your account (blank art until you upload your own) and pays the breed.</p>
      ${toClaim.map(o=>`<div class="reg-row">
        <div style="flex:1;"><b>${esc(o.horseName)}</b><div class="small">${o.kind} · ✦${Number(o.price)||0}${o.reviewNote?` · “${esc(o.reviewNote)}”`:''}</div></div>
        <button data-claim="${esc(o.id)}">Add to my tracker</button>
      </div>`).join("")}</div>` : ''}
    <div class="card"><h3>My orders</h3>
      ${orders.length ? orders.map(o=>`<div class="reg-row">
        <div style="flex:1;"><b>${esc(o.horseName)}</b>
          <div class="small">${o.kind} · ✦${Number(o.price)||0} · <span style="color:${o.status==='placed'?'var(--good)':o.status==='declined'?'var(--bad)':'var(--brass-light)'}">${esc(o.status)}</span>${o.reviewNote?` · “${esc(o.reviewNote)}”`:''}</div></div>
      </div>`).join("") : `<span class="small muted">No orders yet — browse the Imports tab.</span>`}
    </div>`;

  body.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>breedClaimOrder(body, DB, who, breed, orders.find(o=>o.id===b.dataset.claim)));
}

// Buyer claims an approved order: pay the breed's business, then create the
// stamped horse on THEIR OWN account (owner = buyer — rules-clean, no cross writes).
async function breedClaimOrder(body, DB, who, breed, order){
  if(!order) return;
  const price = Number(order.price)||0;
  if(!confirm(`Add “${order.horseName}” to your tracker?\n\n${price>0?`✦${price} will be paid to ${breed.name}.`:'No charge.'}\nA blank horse profile is created — upload your own art anytime.`)) return;

  if(window.EquiAuth && window.EquiAuth.uid !== who.userId){ await upgradeToOwnerSession(); }

  // 1) pay the breed business (buyer's token authorizes it)
  if(price>0){
    if(!breed.businessName){ alert("This breed has no business linked — ask staff to fix it before claiming."); return; }
    const token = await (async()=>{ try{ await window.EquiAuth.ready; return await window.EquiAuth.token(); }catch(e){ return null; } })();
    if(!token){ alert("Session expired — sign out and back in."); return; }
    const pay = await railwayCall('/payBusiness', { idToken: token,
      body:{ businessName:breed.businessName, amount:price, note:`${breed.name} import: ${order.horseName}` } });
    if(!pay || !pay.success){ alert((pay&&pay.error)||"Payment failed — nothing was created."); return; }
  }

  // 2) create the stamped tracked horse on the buyer's account
  const horseId = "h_"+Math.random().toString(36).slice(2,9);
  const horse = {
    id:horseId, name:order.horseName||"New Import", breed:breed.name,
    age:3, stage:"adult", level:1, exp:0,
    importLink: order.designUrl || "",
    ownerName: who.userId,
    fromBreedOrder: order.id,
    createdAt: new Date().toISOString()
  };
  try{
    await DB.put('horses', horseId, who.userId, horse);
  }catch(err){ alert("Paid, but the horse couldn't be created — tell breed staff. ("+(err.message||err)+")"); return; }

  // 3) close out the order and mark the import sold
  try{
    order.status="placed"; order.horseId=horseId; order.placedAt=new Date().toISOString();
    await DB.putWithField('breedOrders', order.id, who.userId, order, 'breedId', order.breedId);
  }catch(e){}
  alert(`“${order.horseName}” is now in your tracker and the ${breed.name} registry. Open the Stable Manager to add art and details.`);
  renderBreeds(document.getElementById('view'));
}

// Approve: mark the order approved so the BUYER can claim it (which pays + creates
// the horse on their own account). Staff attach a design URL for customs here.
async function breedApproveOrder(body, DB, who, breed, order, designEl, noteEl){
  if(!order) return;
  order.status="approved";
  order.reviewedBy=who.userId;
  order.reviewNote=(noteEl&&noteEl.value.trim())||"";
  order.decidedAt=new Date().toISOString();
  if(designEl && designEl.value.trim()) order.designUrl=designEl.value.trim();
  try{
    await DB.putWithField('breedOrders', order.id, order.owner, order, 'breedId', order.breedId);
  }catch(err){
    alert("Couldn't approve — this needs the Firestore rule that lets breed staff update orders for their breed (see the rules guide). ("+(err.message||err)+")");
    return;
  }
  // mark a premade import sold
  if(order.importId){
    try{ const imp=await DB.get('breedImports',order.importId); if(imp){ imp.status='sold'; imp.buyer=order.owner; await DB.put('breedImports', imp.id, imp.owner||breed.owner, imp); } }catch(e){}
  }
  alert(`Approved. ${order.owner} can now claim “${order.horseName}” from their My Orders tab — that's when they pay and the horse is created on their account.`);
  renderBreeds(document.getElementById('view'));
}

// ============================================================
//  SHOPS — player-run stores, listed and managed inside the hub
//  Collections (same {owner,id,json} shape as everything else):
//    shops      : one per shopkeeper {id, owner, name, banner, blurb,
//                 businessName, theme:{accent,bg,panel,head}, createdAt}
//    shopItems  : owner-scoped goods {id, owner, shopId, name, desc,
//                 image, price, stock, uses, category, active}
//  Checkout pays the shopkeeper's bank business (buyer's idToken) then
//  writes the item into the buyer's own inventory/{userId} doc — the same
//  document the tracker and Emporium share.
// ============================================================
const SHOP_THEME_DEFAULTS = { accent:"#d29a3e", panel:"#140e07", head:"#c9a84c" };
// Premium storefronts: these owners may replace their shop's standard hero with
// Premium members (by bank userId). One source of truth for every premium
// perk: custom shop look, multiple shops, profile CSS, the name badge, and the
// higher stat-gear cap. Admins (ADMIN_MEMBERS, from equi-constants.js) are
// premium + uncapped.
// PREMIUM_MEMBERS, isPremiumMember(), gearStatCap(), premiumBadge(),
// sanitizeShopCss(), sanitizeShopHtml() now come from equi-constants.js —
// shared with Stable Manager, which uses the same checks for horse/rider
// profile customization. Do NOT redeclare them here.
// Back-compat alias — old code referenced PREMIUM_SHOP_OWNERS.
const PREMIUM_SHOP_OWNERS = PREMIUM_MEMBERS;
// A friendly status line for the signed-in member: shows premium expiry (or
// "permanent" for the list) if active, otherwise a gentle invite to support.
function premiumStatusLine(uid){
  if(ADMIN_MEMBERS.includes(uid) || PREMIUM_MEMBERS.includes(uid)){
    return `<div class="small" style="color:var(--equi-brass-light);margin-top:2px;">&#128081; Premium member</div>`;
  }
  const until = __premiumCache[uid];
  if(until && until > Date.now()){
    const days = Math.ceil((until - Date.now())/(24*60*60*1000));
    const dateStr = new Date(until).toLocaleDateString();
    return `<div class="small" style="color:var(--equi-brass-light);margin-top:2px;">&#128081; Premium active — ${days} day${days===1?'':'s'} left (until ${dateStr}). Renew anytime; early renewals add on.</div>`;
  }
  return `<div class="small muted" style="margin-top:2px;">Not premium. <a href="https://ko-fi.com/" target="_blank" style="color:var(--accent);">Support EquiStories</a> to unlock the crown, custom shop looks, multiple shops, and +3 gear. Enter your User ID <b>${esc(uid)}</b> at checkout.</div>`;
}

function shopThemeVars(t){
  t = t || {};
  const a = t.accent || SHOP_THEME_DEFAULTS.accent;
  const p = t.panel  || SHOP_THEME_DEFAULTS.panel;
  const h = t.head   || SHOP_THEME_DEFAULTS.head;
  return `--sf-accent:${a}; --sf-panel:${p}; --sf-head:${h};`;
}
// canonical inventory entry — matches the Emporium / tracker shape exactly
function shopInvEntry(shop, item, qty){
  const uses = Number(item.uses)||0;
  const disc = Number(item.discountValue)||0;
  const consumable = uses>0 || disc>0;
  // A "single-use" token (uses<=1) stacks by quantity — each copy = one use.
  // A "multi-use" token (uses>1) pools its uses into usesLeft.
  const multiUse = uses > 1;
  const hasStats = item.stats && Object.keys(item.stats).length>0;
  return {
    id:        shop.id + "_" + item.id,
    itemId:    item.id,
    name:      item.name,
    image:     item.image || null,
    type:      consumable ? "consumable" : "shopgood",
    category:  item.category || "",
    desc:      item.desc || "",
    price:     Number(item.price)||0,
    qty:       qty,
    usesLeft:  multiUse ? uses*qty : undefined,
    discountValue: disc>0 ? disc : undefined,
    singleUse: (consumable && !multiUse) ? true : undefined,
    // consumable effect rides along so the Stable Manager can apply it on use
    kind:        item.kind || undefined,
    effect:      item.effect || undefined,
    effectValue: item.effectValue!=null ? Number(item.effectValue) : undefined,
    effectStat:  item.effectStat || undefined,
    effectTag:   item.effectTag || undefined,
    // tack/apparel bonuses ride along so the Stable Manager can apply them
    wearKind:  item.wearKind || undefined,
    stats:     hasStats ? item.stats : undefined,
    exp:       Number(item.exp)>0 ? Number(item.exp) : undefined,
    pp:        Number(item.pp)>0 ? Number(item.pp) : undefined,
    shopName:  shop.name,
    source:    shop.id
  };
}

let __shopView = { mode:"browse", shopId:null };
// modes: browse | store | manage | bag | create

// How an item behaves. Anything with uses>0 is consumable; a discountValue
// makes it a coupon spent at checkout, otherwise it's a token used in
// breeding/customs (Twin, Reroll, Stat Reset, Treats, trait tokens…).
function itemKind(item){
  if(Number(item.discountValue) > 0) return "discount";
  if(Number(item.uses) > 0 || item.kind === "token") return "token";
  return "good";
}
function invEntryKind(e){
  if(Number(e.discountValue) > 0) return "discount";
  // Treats are consumed on training IMAGES (in the Stable Manager), so they get
  // NO "Use" button here — they just wait in the saddlebag.
  if(e.effect === "exp" || e.effect === "stat" || e.kind === "treat_exp" || e.kind === "treat_stat") return "treat";
  // Tokens (breeding/custom) DO get a Use button that writes a redemption record.
  if(e.kind === "token" || e.effect === "breed_token") return "token";
  // Legacy generic consumables (no kind/effect) keep the old token behavior.
  if(Number(e.usesLeft) > 0 || e.singleUse === true || e.type === "consumable") return "token";
  return "good";
}

// Append-only redemption ledger. Each use writes its OWN document (unique id),
// so there's no read-modify-write race and Firestore rules can forbid editing
// or deleting a record after the fact — that's what makes it cheat-proof.
async function logRedemption(DB, userId, entry, detail){
  const rec = {
    id: "rdm_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7),
    userId, itemId: entry.itemId, name: entry.name,
    source: entry.source || "", shopName: entry.shopName || "",
    kind: invEntryKind(entry),
    detail: detail || "",
    usedAt: new Date().toISOString()
  };
  await DB.put('redemptions', rec.id, userId, rec);
  return rec;
}

async function renderShops(v){
  const who = me();
  const DB = await waitForDB();
  if(!DB){ v.innerHTML = `<div class="card"><div class="small">Database unavailable.</div></div>`; return; }

  if(__shopView.mode === "create"){ return renderShopCreate(v, DB, who); }
  if(__shopView.mode === "manage"){ return renderShopManage(v, DB, who); }
  if(__shopView.mode === "store"){  return renderStorefront(v, DB, who, __shopView.shopId); }
  if(__shopView.mode === "bag"){    return renderSaddlebag(v, DB, who); }
  return renderShopBrowse(v, DB, who);
}

/* ---------------- a single storefront (buyer view) ---------------- */
async function renderStorefront(v, DB, who, shopId){
  const shop = await DB.get('shops', shopId);
  if(!shop){ __shopView={mode:"browse"}; return renderShops(v); }
  let items = [];
  try{ items = await DB.listByOwner('shopItems', shop.owner); }catch(e){}
  items = items.filter(i=>i && i.shopId===shopId && i.active!==false && !i.redeemOnly);

  // Coupons the buyer owns that THIS shop issued (discounts are per-shop).
  let coupons = [];
  if(who){
    try{
      const inv = await DB.get('inventory', who.userId);
      coupons = ((inv && inv.items)||[]).filter(e=> e.source===shop.id && Number(e.discountValue)>0 && (Number(e.qty)||0)>0);
    }catch(e){}
  }

  v.innerHTML = `
    <div class="shop-crumb">
      <button class="ghost" id="sf_back">← All shops</button>
      ${who ? `<button class="ghost" id="sf_bag">My saddlebag</button>` : ``}
      ${who && who.userId===shop.owner ? `<button id="sf_manage">Manage this shop</button>` : ``}
    </div>
    ${buildStorefrontHtml()}`;

  function buildStorefrontHtml(){
    const premium = PREMIUM_SHOP_OWNERS.includes(shop.owner);
    // Standard hero (used unless a premium owner supplies wrapper HTML).
    const heroHtml = `<div class="sf-hero">
        <div class="banner ${imgOk(shop.banner)?'':'noimg'}" ${imgOk(shop.banner)?`style="background-image:url('${esc(shop.banner)}')"`:''}>${imgOk(shop.banner)?'':'🏪'}</div>
        <div class="meta">
          <h2>${esc(shop.name)}</h2>
          <div class="small">Kept by ${esc(shop.owner)}${premiumBadge(shop.owner)}${shop.businessName?` · pays to <b>${esc(shop.businessName)}</b>`:''}</div>
          ${shop.blurb?`<p style="margin:8px 0 0;">${esc(shop.blurb)}</p>`:''}
        </div>
      </div>`;

    // The live, hub-powered shop content: coupon picker + item grid + buy buttons.
    // This is ALWAYS real hub markup — a premium owner's CSS restyles it, but the
    // buying logic is never theirs, so it can't touch anyone's session.
    const liveShop = `
      ${!who ? `<div class="card"><span class="small muted">Sign in to buy.</span></div>` : ''}
      ${who && coupons.length ? `<div class="card sf-coupons" style="margin-bottom:14px;">
        <label>Discount ticket</label>
        <select id="sf_coupon">
          <option value="">No ticket — pay full price</option>
          ${coupons.map(c=>`<option value="${esc(c.itemId)}">${esc(c.name)} — ✦${Number(c.discountValue)} off${(Number(c.qty)||1)>1?` (×${c.qty})`:''}</option>`).join("")}
        </select>
        <p class="small muted" style="margin:6px 0 0;">A ticket is spent when you buy. Discounts never take a price below ✦0.</p>
      </div>` : ''}
      ${items.length ? `<div class="sf-grid">${items.map(i=>{
        const soldOut = Number(i.stock)===0;
        const uses = Number(i.uses)||0;
        const disc = Number(i.discountValue)||0;
        return `<div class="sf-item">
          <div class="img ${imgOk(i.image)?'':'noimg'}" ${imgOk(i.image)?`style="background-image:url('${esc(i.image)}')"`:''}>${imgOk(i.image)?'':'✦'}</div>
          <div class="pad">
            <div class="nm">${esc(i.name)}</div>
            ${i.category?`<span class="tag">${esc(i.category)}</span>`:''}
            ${disc>0?`<span class="small" style="color:var(--accent2);">🎟️ Discount ticket · ✦${disc} off</span>`
              :(uses>0?`<span class="small" style="color:var(--accent2);">✨ ${uses} use${uses>1?'s':''} each</span>`:'')}
            ${i.desc?`<span class="small" style="opacity:.85;">${esc(i.desc)}</span>`:''}
            <span class="small ${soldOut?'':'muted'}">${soldOut?'Sold out':(i.stock===''||i.stock==null?'In stock':`${i.stock} left`)}</span>
            <span class="sf-price">✦ ${Number(i.price)||0}</span>
            <button class="sf-buy" data-buy="${esc(i.id)}" ${(!who||soldOut)?'disabled':''}>${soldOut?'Sold out':'Buy'}</button>
            <div class="small" data-msg="${esc(i.id)}" style="min-height:1em;"></div>
          </div>
        </div>`;
      }).join("")}</div>` : `<div class="card"><span class="small muted">No items stocked yet.</span></div>`}`;

    // Premium styling: owner CSS is scoped under .storefront-custom and sanitized
    // (no </style>, @import, or url(javascript:) escapes). Their wrapper HTML frames
    // the page; {{SHOP}} marks where the live shop drops in. No scripts, ever.
    if(premium && (shop.customCss || shop.customWrap)){
      const css = sanitizeShopCss(shop.customCss||"");
      // IMPORTANT: sanitize the OWNER's wrapper HTML on its own, THEN drop the
      // trusted, hub-generated live shop into the already-clean wrapper. The
      // live shop contains <select> and buy buttons that the HTML sanitizer
      // would otherwise strip — it must never pass through sanitizeShopHtml.
      const liveBlock = `<div class="sf-live">${liveShop}</div>`;
      // Strip HTML comments from the wrapper FIRST — otherwise a stray {{SHOP}}
      // mentioned in a comment would swallow the substitution. Then replace
      // EVERY {{SHOP}} occurrence (global), so the live shop always lands.
      const wrapClean = (shop.customWrap || "").replace(/<!--[\s\S]*?-->/g, "");
      const hasPlaceholder = /\{\{\s*SHOP\s*\}\}/.test(wrapClean);
      let frame;
      if(hasPlaceholder){
        frame = sanitizeShopHtml(wrapClean).replace(/\{\{\s*SHOP\s*\}\}/g, liveBlock);
        // Safety net: if the placeholder didn't survive for any reason, append
        // the shop so items always show rather than vanishing.
        if(!frame.includes(liveBlock)) frame += liveBlock;
      } else {
        frame = (wrapClean.trim() ? sanitizeShopHtml(wrapClean) : heroHtml) + liveBlock;
      }
      return `<div class="storefront storefront-custom" style="${shopThemeVars(shop.theme)}">
        ${css?`<style>${css}</style>`:''}
        ${frame}
      </div>`;
    }
    // Standard storefront.
    return `<div class="storefront" style="${shopThemeVars(shop.theme)}">
      ${heroHtml}
      ${liveShop}
    </div>`;
  }

  $("sf_back").onclick = ()=>{ __shopView={mode:"browse"}; renderShops(v); };
  if($("sf_bag")) $("sf_bag").onclick = ()=>{ __shopView={mode:"bag"}; renderShops(v); };
  if($("sf_manage")) $("sf_manage").onclick = ()=>{ __shopView={mode:"manage",shopId:null}; renderShops(v); };

  v.querySelectorAll('[data-buy]').forEach(btn=>btn.onclick=()=>buyFromShop(v, DB, who, shop, items, btn.dataset.buy));
}

async function buyFromShop(v, DB, who, shop, items, itemId){
  const item = items.find(i=>i.id===itemId);
  const msg = v.querySelector(`[data-msg="${CSS.escape(itemId)}"]`);
  if(!item || !msg) return;
  if(!shop.businessName){ msg.innerHTML = `<span style="color:var(--bad)">This shop has no business linked — it can't take payment.</span>`; return; }
  const btn = v.querySelector(`[data-buy="${CSS.escape(itemId)}"]`);
  btn.disabled = true; msg.textContent = "Paying…";

  const token = await (async()=>{ try{ await window.EquiAuth.ready; return await window.EquiAuth.token(); }catch(e){ return null; } })();
  if(!token){ msg.innerHTML = `<span style="color:var(--bad)">Session expired — sign out and back in.</span>`; btn.disabled=false; return; }

  const listPrice = Number(item.price)||0;

  // Read the buyer's inventory up front — we may spend a coupon and we deliver here.
  let inv;
  try{ inv = (await DB.get('inventory', who.userId)) || { id:who.userId, items:[] }; inv.items = inv.items||[]; }
  catch(err){ msg.innerHTML = `<span style="color:var(--bad)">Couldn't read your saddlebag — try again.</span>`; btn.disabled=false; return; }

  // Resolve a chosen discount ticket (must be owned, issued by this shop).
  const sel = $("sf_coupon");
  const couponItemId = sel ? sel.value : "";
  let coupon = null, discount = 0;
  if(couponItemId){
    coupon = inv.items.find(e=> e.source===shop.id && String(e.itemId)===String(couponItemId) && Number(e.discountValue)>0 && (Number(e.qty)||0)>0);
    if(coupon) discount = Math.min(Number(coupon.discountValue)||0, listPrice); // clamp: never below 0
  }
  const charge = Math.max(0, listPrice - discount);

  // Charge (skip the bank entirely if a ticket makes it free).
  if(charge > 0){
    const pay = await railwayCall('/payBusiness', { idToken: token,
      body:{ businessName:shop.businessName, amount:charge,
      note:`Shop: ${shop.name} — ${item.name}${discount?` (ticket −✦${discount})`:''}` } });
    if(!pay || !pay.success){ msg.innerHTML = `<span style="color:var(--bad)">${esc((pay&&pay.error)||'Payment failed.')}</span>`; btn.disabled=false; return; }
  }

  // Deliver + spend the ticket in the SAME inventory write (one save, consistent).
  try{
    if(coupon){
      coupon.qty = (Number(coupon.qty)||0) - 1;
      if(coupon.qty <= 0) inv.items = inv.items.filter(x=>x!==coupon);
      // ticket use is itself a redemption record (audit trail for discounts too)
      logRedemption(DB, who.userId, coupon, `Applied ✦${discount} to “${item.name}” at ${shop.name}`).catch(()=>{});
    }
    const existing = inv.items.find(x=>x.itemId===item.id && x.source===shop.id);
    if(existing){
      existing.qty = (Number(existing.qty)||0) + 1;
      // multi-use tokens pool their uses; single-use/discount stack by qty only
      if(Number(item.uses) > 1) existing.usesLeft = (Number(existing.usesLeft)||0) + Number(item.uses);
      else if(existing.singleUse) existing.usesLeft = existing.qty;
    } else {
      inv.items.push(shopInvEntry(shop, item, 1));
    }
    await DB.put('inventory', who.userId, who.userId, inv);
  }catch(err){
    msg.innerHTML = `<span style="color:var(--bad)">Paid, but delivery hit a snag — tell ${esc(shop.owner)}. (${esc(err.message||err)})</span>`;
    return;
  }

  // Decrement stock if the shop tracks it (best-effort; shopkeeper owns the doc).
  if(typeof item.stock === 'number' && item.stock > 0){
    try{ item.stock -= 1; await DB.put('shopItems', item.id, shop.owner, item); }catch(e){}
  }
  const paidLine = charge>0 ? `✦ ${charge} paid` : `free with ticket`;
  msg.innerHTML = `<span style="color:var(--good)">Bought! ${paidLine}${discount?` (saved ✦${discount})`:''} · check your saddlebag.</span>`;
  // Refresh so the coupon dropdown and stock reflect the purchase.
  setTimeout(()=>renderShops(v), 900);
}

      <div class="grid" style="grid-template-columns:1fr 1fr 1fr; gap:10px;">
